15,thresholds:[7,13],hp:7,stress:3,attack:{bonus:"+4",weapon:"钉头锤",range:"近战",damage:"1d10+4 物理",line:"攻击：+4 | 钉头锤：近战 | 1d10+4 物理"},experiences:"指挥官+2，本地知识+2",description:"一位手持钉头锤、挂着哨子、声如洪钟的老练警卫。",motives:"逮捕，封锁，压制目标，追求荣耀",tierNote:"",features:[{name:"集结警卫 Rally Guards - 动作",desc:"花费 2 恐惧点，聚焦警卫队长及2d4名远距离范围内的盟友。"},{name:"听我号令 On My Signal - 反应",desc:"倒计时（5），当警卫队长首次被聚焦时，启动倒计时。当玩家角色进行攻击掷骰时，倒计时推进。触发时，所有远距离范围内的持弓警卫对自身射程内最近目标发动具有优势的普通攻击。若多名持弓警卫命中同一目标，伤害叠加。"},{name:"乘胜追击 Momentum - 反应",desc:"当警卫队长成功命中玩家角色时，你获得 1 恐惧点。"}],url:"https://daggerheart.huijiwiki.com/wiki/%E8%AD%A6%E5%8D%AB%E9%98%9F%E9%95%BF"},{id:"%E8%8D%86%E6%A3%98%E9%9E%AD",name:"荆棘鞭",original:"BRIARWHIP",tier:1,type:"头目",difficulty:14,thresholds:[9,14],hp:6,stress:4,attack:{bonus:"+3",weapon:"淬毒荆棘鞭",range:"近距离范围",damage:"1d10+2 物理",line:"攻击：+3 | 淬毒荆棘鞭：近距离范围 | 1d10+2 物理"},experiences:"隐藏+2，威吓+2，追踪+3",description:"一位狡猾精明的游侠，承担着最危险的任务。",motives:"探索、计划、保护、偷窃",tierNote:"",features:[{name:"愈战愈强 Ferocious Defense - 被动",desc:"当荆棘鞭的攻击导致目标标记生命点时，荆棘鞭的难度获得 +1 加值，直到其标记 1 点或更多生命点。"},{name:"丛中荆棘 Into the Bramble - 动作",desc:"花费 1 恐惧点，聚焦至多 1d4 个远距离范围内的盟友。他们移动到近距离范围内的掩体中，直到他们下次攻击后或一名玩家角色成功进行本能掷骰找到他们之前，他们都处于隐藏状态。"},{name:"警戒防备 Brace - 反应",desc:"当荆棘鞭标记 1 点或更多生命点时，你可以标记 1 压力点，使其标记的生命点减少 1 点。"}],url:"https://daggerheart.huijiwiki.com/wiki/%E8%8D%86%E6%A3%98%E9%9E%AD"},{id:"%E5%B7%A8%E9%BC%A0",name:"巨鼠",original:"GIANT RAT",tier:1,type:"杂兵",difficulty:10,thresholds:[null,null],hp:1,stress:1,attack:{bonus:"-4",weapon:"爪击",range:"近战",damage:"1 物理",line:"攻击：-4 | 爪击：近战 | 1 物理"},experiences:"敏锐感知+3",description:"一种大小如猫的啮齿动物，擅长觅食与生存。",motives:"挖掘、饥饿、觅食、消耗",tierNote:"",features:[{name:"杂兵 Minion（3） - 被动",desc:"巨鼠在受到任何伤害时都会立即被击败。玩家角色每对巨鼠造成 3 点伤害，则在该次攻击的范围内额外再击败一个能够命中的杂兵。"},{name:"群体攻击 Group Attack - 动作",desc:"花费 1 恐惧点选择一个目标，并聚焦所有在目标近距离范围内的巨鼠。当这些杂兵移动至目标的近战范围时，进行一次共享的攻击掷骰。若成功，每只巨鼠造成 1 点物理伤害，将伤害合并计算。"}],url:"https://daggerheart.huijiwiki.com/wiki/%E5%B7%A8%E9%BC%A0"},{id:"%E5%B4%87%E6%8B%9C%E9%AD%94%E4%BB%86",name:"崇拜魔仆",original:"IDOLIZING IMP",tier:3,type:"杂兵",difficulty:17,thresholds:[null,null],hp:1,stress:1,attack:{bonus:"+0",weapon:"利爪",range:"近战",damage:"7点 物理",line:"攻击：+0 | 利爪：近战 | 7点 物理"},experiences:"",description:"一位卑躬屈膝向其主子致敬的恶魔。",motives:"防御、欺骗、崇拜",tierNote:"",features:[{name:"杂兵 Minion （8） - 被动",desc:"魔仆受到任何伤害时即被击败。玩家角色攻击对魔仆每造成 8 点伤害，则额外击败攻击成功范围内的一名仆从。"},{name:"集体攻击 Group Attack - 动作",desc:"花费 1 恐惧点选择一个目标，并聚焦所有在其近距离范围内的崇拜魔仆。这些杂兵移动至目标的近战范围，并进行一次共享的攻击掷骰。成功时，每只魔仆造成 7 点物理伤害。将这些伤害叠加计算。"}],url:"https://daggerheart.huijiwiki.com/wiki/%E5%B4%87%E6%8B%9C%E9%AD%94%E4%BB%86"},{id:"%E6%88%98%E4%BA%89%E6%B3%95%E5%B8%88",name:"战争法师",original:"WAR WIZARD",tier:2,type:"远程",difficulty:16,thresholds:[11,23],hp:5,stress:6,attack:{bonus:"+4",weapon:"法杖",range:"远距离",damage:"2d10+4 魔法",line:"攻击：+4 | 法杖：远距离 | 2d10+4 魔法"},experiences:"魔法学识+2，策略+2",description:"一名精通破坏魔法、久经沙场的法师。",motives:"研发新法术，追求力量，打破阵型",tierNote:"",features:[{name:"战斗传送 Battle Teleport - 被动",desc:"在进行普通攻击之前或之后，你可以标记 1 压力点以传送到远距离范围内的一个位置。"},{name:"刷新防护球 Refresh Warding Sphere - 动作",desc:"标记 1 压力点以刷新战争法师的“防护球”反应。"},{name:"地壳喷发 Eruption - 动作",desc:"花费 1 恐惧点并选择远距离范围内的一个点。该点周围的邻近范围区域会喷发，变成不可逾越的地形。该区域内的所有目标必须进行一次敏捷反应掷骰（14）。失败的目标受到2d10物理伤害并被抛出该区域。成功的目标受到一半伤害且不会被移动。"},{name:"奥术炮击 Arcane Artillery - 动作",desc:"花费 1 恐惧点以释放精确的魔法弹幕。场景中的所有目标必须进行一次敏捷反应掷骰。失败的目标受到2d12魔法伤害。成功的目标受到一半伤害。"},{name:"防护球 Warding Sphere - 反应",desc:"当战争法师受到近距离范围内的攻击伤害时，对攻击者造成2d6魔法伤害。该反应在法师使用其“刷新防护球”动作刷新前无法再次使用。"}],url:"https://daggerheart.huijiwiki.com/wiki/%E6%88%98%E4%BA%89%E6%B3%95%E5%B8%88"},{id:"%E5%86%B0%E8%8D%92%E7%8C%8E%E4%BA%BA",name:"冰荒猎人",original:"ICEWASTE HUNTER",tier:2,type:"远程",difficulty:13,thresholds:[7,14],hp:5,stress:4,attack:{bonus:"+3",weapon:"长弓",range:"远",damage:"2d12+6 物理",line:"攻击：+3 | 长弓：远 | 2d12+6 物理"},experiences:"导航+2，生存者+3",description:"一位在冰原中狩猎危险猎物的求生者。",motives:"狩猎、忍耐、救援、追踪",tierNote:"",features:[{name:"稳固瞄准 Steady Aim - 被动",desc:"标记 1 压力点使冰荒猎人的下一次攻击获得优势。"},{name:"雪盲陷阱 Snowblind Trap - 动作",desc:"花费 1 恐惧点以选择近距离范围内的一个群体。所有目标必须成功进行敏捷反应掷骰，否则将被困在陷阱中，处于 脆弱 状态，其在直到成功进行一次力量或灵巧（14）掷骰来逃脱。当被困在此陷阱中的目标进行动作掷骰时，你获得 1 恐惧点。"},{name:"寻找掩护！ Take Cover！ - 反应",desc:"标记 1 压力点使一次对抗冰荒猎人的攻击获得劣势。如若该攻击仍然命中，则将其受到的伤害程度降低一个等级。"}],url:"https://daggerheart.huijiwiki.com/wiki/%E5%86%B0%E8%8D%92%E7%8C%8E%E4%BA%BA"},{id:"%E9%94%AF%E9%BD%BF%E5%88%80%E5%BD%B1%E5%AD%90",name:"锯齿刀影子",original:"JAGGED KNIFE SHADOW",tier:1,type:"潜伏",difficulty:12,thresholds:[4,8],hp:3,stress:3,attack:{bonus:"+1",weapon:"匕首",range:"近战",damage:"1d4+4 物理",line:"攻击：+1 | 匕首：近战 | 1d4+4 物理"},experiences:"入侵+3",description:"一名身手敏捷的无赖，手持利刃，善于运用暗影魔法孤立目标。",motives:"伏击、隐蔽、分割、获利",tierNote:"",features:[{name:"背刺 Backstab - 被动",desc:"当锯齿刀影子在具有优势的普通攻击中命中目标时，将造成1d6+6点物理伤害而非普通伤害。"},{name:"隐匿无踪 Cloaked - 动作",desc:"进入 隐藏 状态直至下次攻击。通过此特性在处于 隐藏 状态下发动的攻击具有优势。"}],url:"https://daggerheart.huijiwiki.com/wiki/%E9%94%AF%E9%BD%BF%E5%88%80%E5%BD%B1%E5%AD%90"},{id:"%E6%99%B6%E8%BE%89%E9%BE%99",name:"晶辉龙",original:"GLITTERWYRM",tier:2,type:"潜伏",difficulty:14,thresholds:[9,18],hp:5,stress:4,attack:{bonus:"+2",weapon:"撕咬",range:"邻近",damage:"2d8+3 物理",line:"攻击：+2 | 撕咬：邻近 | 2d8+3 物理"},experiences:"空中掠食者+2，敏锐视觉+3",description:"一条覆盖着镜面冰鳞的飞龙。",motives:"伏击、采食、冬眠、游击",tierNote:"",features:[{name:"极地翼种 Arctic Avian - 被动",desc:"飞行时，晶辉龙可以移动至远距离范围。"},{name:"反射鳞片 Reflective - 被动",desc:"不处于晶辉龙邻近范围内的生物对其攻击具有劣势。"},{name:"迅捷利爪 Swift Claws - 动作",desc:"标记 1 压力点，选择远距离范围内的一点。晶辉龙移动到该点，并对邻近范围内的一个目标进行一次攻击。成功时，造成 2d10+5 点物理伤害，且目标必须成功进行一次力量反应掷骰，否则被击退至近距离范围。"},{name:"冰锥倒刺 Icicle Barb - 动作",desc:"花费 1 恐惧点，对近距离范围内的一个群体进行一次攻击。闪耀龙攻击成功的目标受到 2d4 点物理伤害，并因倒刺处于 束缚 状态，直到其通过一次成功的灵巧掷骰挣脱。"}],url:"https://daggerheart.huijiwiki.com/wiki/%E6%99%B6%E8%BE%89%E9%BE%99"},{id:"%E5%95%86%E4%BA%BA",name:"商人",original:"MERCHANT",tier:1,type:"社交",difficulty:12,thresholds:[4,8],hp:3,stress:3,attack:{bonus:"−4",weapon:"棍棒",range:"近战",damage:"1d4+1 物理",line:"攻击：−4 | 棍棒：近战 | 1d4+1 物理"},experiences:"伶牙俐齿+3",description:"一个衣着考究的商人，对金钱利益有着敏锐的嗅觉。",motives:"低买高卖、创造需求、抬高价格、追求利益",tierNote:"",features:[{name:"优先待遇 Preferential Treatment - 被动",desc:"玩家角色在对抗商人进行的风度掷骰中成功时，购买商品可获得折扣。玩家角色在对抗商人进行的风度掷骰中失败时，必须支付更多金币，并且在将来再次对抗商人进行风度掷骰时处于劣势。"},{name:"敷衍了事 The Runaround - 被动",desc:"当玩家角色在对抗商人进行的风度掷骰中掷出 14 或更低时，他们必须标记 1 压力点。"}],url:"https://daggerheart.huijiwiki.com/wiki/%E5%95%86%E4%BA%BA"},{id:"%E6%9D%91%E5%BA%84%E9%95%BF%E8%80%85",name:"村庄长者",original:"VILLAGE ELDER",tier:1,type:"社交",difficulty:14,thresholds:[6,null],hp:2,stress:4,attack:{bonus:"−2",weapon:"匕首",range:"近战",damage:"1d4+2 物理",line:"攻击：−2 | 匕首：近战 | 1d4+2 物理"},experiences:"历史+2，自然之友+3，社区支柱+3",description:"一位森林村落的长者，能唤起自然魔法以庇护其族人。",motives:"照料社区、裁断是非、柔声细语、维护传统",tierNote:"",features:[{name:"老成持重 Age Taught Me Well - 被动",desc:"所有对长老进行欺瞒的动作掷骰都具有劣势。"},{name:"无礼不容 No Hospitality - 动作",desc:"标记 1 压力点，禁止长老的任何盟友在接下来的 2d6 天内向一个目标或其盟友出售物品或提供任何好处。"},{name:"必有和平 There Will Be Peace - 反应",desc:"当一个生物在长老视线范围内攻击村落中的其他人时，你可以花费 2 恐惧点，使该生物失去所有希望点，标记 2d4 压力点，并进行一次风度反应掷骰（15），失败则会陷入昏迷状态，持续 1d4 小时。在昏迷状态下，目标无法进行动作掷骰，无法说话，并且所有反应掷骰自动失败。此反应一旦使用，长者将无法再次发动。"}],url:"https://daggerheart.huijiwiki.com/wiki/%E6%9D%91%E5%BA%84%E9%95%BF%E8%80%85"},{id:"%E5%B9%BC%E5%B9%B4%E9%97%AA%E5%85%89%E8%9C%93",name:"幼年闪光蜓",original:"JUVENILE FLICKERFLY",tier:2,type:"独狼",difficulty:14,thresholds:[13,26],hp:10,stress:5,attack:{bonus:"+3",weapon:"翅膀斩击",range:"邻近",damage:"2d10+4 物理",line:"攻击：+3 | 翅膀斩击：邻近 | 2d10+4 物理"},experiences:"",description:"一只大小跟马匹相近、拥有彩虹鳞片和晶莹翅膀、飞行速度快到肉眼难以捕捉的昆虫。",motives:"收集闪亮物品、狩猎、俯冲袭击",tierNote:"",features:[{name:"无情 Relentless （3） - 被动",desc:"在每个游戏主持人轮次中，此敌人可以至多被聚焦 3 次。像往常一样花费恐惧点来聚焦。"},{name:"非凡精准 Peerless Accuracy - 被动",desc:"在幼年闪光蜓攻击之前，掷一个 d6。结果为4或更高时，目标在对抗此次攻击时闪避值减半。"},{name:"心灵舞动 Mind Dance - 动作",desc:"标记 1 压力点以创造一个魔法炫目效果，影响附近敌人的心智。近距离范围内的所有目标必须进行一次本能反应掷骰。对于每个失败的目标而言，你获得 1 恐惧点，且幼年闪光蜓得知一项目标所惧怕的事物。"},{name:"幻觉吐息 Hallucinatory Breath - 反应",desc:"倒计时 （循环 1d6）。 当幼年闪光蜓第一次受到伤害时，启动倒计时。当倒计时触发时，幼年闪光蜓向其正前方远距范围内所有目标吐出幻觉气体。目标必须成功进行一次本能反应掷骰，否则被恐怖的幻觉折磨。若幼年闪光蜓已知目标所惧怕的事物，则该目标掷骰时处于劣势。失败的目标须标记 1 压力点并失去 1 希望点。"}],url:"https://daggerheart.huijiwiki.com/wiki/%E5%B9%BC%E5%B9%B4%E9%97%AA%E5%85%89%E8%9C%93"},{id:"%E6%81%B6%E5%A0%95%E5%B7%A8%E5%83%8F",name:"恶堕巨像",original:"MALEFACTED GIANT",tier:2,type:"独狼",difficulty:15,thresholds:[16,26],hp:10,stress:5,attack:{bonus:"+3",weapon:"扭动肢体",range:"近距离",damage:"2d12+4 物理",line:"攻击：+3 | 扭动肢体：近距离 | 2d12+4 物理"},experiences:"",description:"一个由扭曲金属与熔化血肉以非自然方式融合而成的巨型类人生物。",motives:"收集秘密，撕裂现实，逆转命运",tierNote:"",features:[{name:"终焉显现 Behold the End - 被动",desc:"在玩家角色进行会影响恶堕巨像的动作掷骰前，必须先进行一次知识反应掷骰。失败时，玩家角色失去 1 希望点。成功时，玩家角色永久不受此特性影响。"},{name:"虚空之嚎 Scream into the Void - 动作",desc:"花费 1 恐惧点释放一次心灵尖啸。近距离范围内的所有目标必须在一次风度反应掷骰中成功，否则受到 3d10 点直接魔法伤害并标记 1 压力点。"},{name:"破心者 Mindbreaker - 动作",desc:"进行一次普通攻击。成功时，标记 1 压力点以在伤害掷骰中增加一个 d8。如果目标因此次攻击标记生命点，其下一次动作掷骰具有劣势。"},{name:"横扫恐惧 Sweeping Dread - 反应",desc:"倒计时 （循环 1d4）。当恶堕巨像第一次看到敌对目标时，激活倒计时。当玩家角色骰出恐惧结果时，倒计时减少。当倒计时触发时，恶堕巨像对近距离范围内最多三个目标进行一次普通攻击。恶堕巨像成功命中的目标失去 1 希望点。"},{name:"拒绝现实 Reject Reality - 反应",desc:"位于恶堕巨像远距离范围内的生物在一次动作掷骰中关键成功时，恶堕巨像清除所有压力点。"}],url:"https://daggerheart.huijiwiki.com/wiki/%E6%81%B6%E5%A0%95%E5%B7%A8%E5%83%8F"},{id:"%E6%8C%81%E5%88%83%E8%AD%A6%E5%8D%AB",name:"持刃警卫",original:"BLADED GUARD",tier:1,type:"标准",difficulty:12,thresholds:[5,9],hp:5,stress:2,attack:{bonus:"+1",weapon:"长剑",range:"近战",damage:"1d6+1 物理",line:"攻击：+1 | 长剑：近战 | 1d6+1 物理"},experiences:"本地知识+3",description:"一名身披盔甲、手持剑盾的卫兵，盾面涂有所处城镇的代表色。",motives:"逮捕、封锁、熬过今日、压制目标",tierNote:"",features:[{name:"盾墙 Shield Wall - 被动",desc:"试图在持刃警卫邻近范围内移动的生物必须进行一次成功的敏捷掷骰。若有其他持刃警卫与其并列站立，且每名持刃警卫均在另一名持刃警卫的近战范围内，则将持刃警卫的总人数加入到掷骰的难度中。"},{name:"拘押 Detain - 动作",desc:"对邻近范围内的目标进行一次攻击。成功时，标记 1 压力点以使目标处于 束缚 状态，直到其通过成功的攻击、灵巧掷骰或力量掷骰挣脱为止。"}],url:"https://daggerheart.huijiwiki.com/wiki/%E6%8C%81%E5%88%83%E8%AD%A6%E5%8D%AB"},{id:"%E5%88%83%E8%88%9E%E5%B0%8F%E4%B8%91",name:"刃舞小丑",original:"BLADEDANCE JESTER",tier:4,type:"标准",difficulty:19,thresholds:[22,50],hp:5,stress:3,attack:{bonus:"+3",weapon:"链刃环",range:"邻近",damage:"4d8+5 物理",line:"攻击：+3 | 链刃环：邻近 | 4d8+5 物理"},experiences:"喜剧+2，舞蹈+3",description:"一名身姿轻盈、与异界之舞共鸣的马戏表演者。",motives:"领舞，娱乐，诱离",tierNote:"",features:[{name:"与我共舞 Dance With Me - 动作",desc:"对邻近范围内的一个目标进行一次攻击。成功时，目标必须通过一次敏捷反应掷骰，否则将被拉到刃舞小丑的近战范围内，并且当其下次移动时，你获得 1 恐惧点。"},{name:"无声断奏 Silent Staccato - 反应",desc:"当刃舞小丑受到伤害时，你可以标记 1 压力点来减少 3d6 点伤害。然后刃舞小丑可以移动到近距离范围内的任意一点。"}],url:"https://daggerheart.huijiwiki.com/wiki/%E5%88%83%E8%88%9E%E5%B0%8F%E4%B8%91"},{id:"%E9%82%AA%E6%95%99%E9%97%A8%E5%BE%92",name:"邪教门徒",original:"CULT ADEPT",tier:2,type:"辅助",difficulty:14,thresholds:[9,18],hp:4,stress:6,attack:{bonus:"+2",weapon:"印符法杖",range:"远距离",damage:"2d4+3 魔法",line:"攻击：+2 | 印符法杖：远距离 | 2d4+3 魔法"},experiences:"堕落学识+2，仪式法术+2",description:"一位操纵暗影与恐惧的老练法师。",motives:"祈求恩宠、阻碍敌人、揭示知识",tierNote:"",features:[{name:"虚弱冲击 Enervating Blast - 动作",desc:"花费 1 恐惧点对范围内的一个目标进行普通攻击。成功时，目标必须标记 1 压力点。"},{name:"堕影护幕 Shroud of the Fallen - 动作",desc:"标记 1 压力点将近距离范围内的一名盟友包裹在护幕之中，使其处于 保护 状态，直到邪教信徒标记最后一个生命点。处于 保护 状态时，目标对所有伤害具有抗性。"},{name:"暗影镣铐 Shadow Shackles - 动作",desc:"花费 1 恐惧点并选择远距离范围内的一个点。该点近距离范围内的所有目标都被烟雾状的链条 束缚 ，直到通过一次成功的力量或本能掷骰来挣脱。因此特性处于 束缚 状态的目标必须花费 1 希望点才能进行动作掷骰。"},{name:"以惧为薪 Fear Is Fuel - 反应",desc:"每场景两次，当玩家角色骰出恐惧失败时，清除 1 压力点。"}],url:"https://daggerheart.huijiwiki.com/wiki/%E9%82%AA%E6%95%99%E9%97%A8%E5%BE%92"},{id:"%E6%A3%AE%E6%9E%97%E5%BE%B7%E9%B2%81%E4%BC%8A",name:"森林德鲁伊",original:"FOREST DRUID",tier:1,type:"辅助",difficulty:11,thresholds:[6,10],hp:4,stress:5,attack:{bonus:"+0",weapon:"橡木杖",range:"近战",damage:"1d4+2 魔法",line:"攻击：+0 | 橡木杖：近战 | 1d4+2 魔法"},experiences:"动物知识+2，地形知识+3",description:"一位能够与野兽与树叶对话的隐居漫游者。",motives:"呼唤自然，不留痕迹，不惜一切代价保护森林。",tierNote:"",features:[{name:"幽谷宁静 Calm of the Vale - 动作",desc:"标记 1 压力点，结束一个法术的效果，或清除一个影响森林德鲁伊或其在邻近范围内可见的盟友的任何状态。"},{name:"震耳低语 Deafening Whisper - 动作",desc:"标记 1 压力点，呼唤藏匿树冠中的强风。近距离范围内的一个目标必须进行一次成功的本能反应掷骰，否则呼啸的风会充满他们的耳朵。目标仅能听到风声，且必须标记 1 压力点，并且在其清除 1 压力点之前处于 脆弱 状态。"},{name:"过度生长 Overgrowth - 动作",desc:"花费 1 恐惧点，选择远距离范围内的一个点。荆棘和倒刺从地面喷发，填满该点近距离范围内的区域。进入该区域或试图穿过该区域的生物受到 2d6+3 点物理伤害，并且必须进行一次成功的敏捷反应掷骰，否则会处于 束缚 状态，直到其进行一次成功的灵巧掷骰以挣脱或森林德鲁伊受到严重伤害。"}],url:"https://daggerheart.huijiwiki.com/wiki/%E6%A3%AE%E6%9E%97%E5%BE%B7%E9%B2%81%E4%BC%8A"},{id:"%E9%85%B8%E6%B6%B2%E6%8E%98%E5%9C%B0%E8%80%85",name:"酸液掘地者",original:"ACID BURROWER",tier:1,type:"独狼",difficulty:14,thresholds:[8,15],hp:8,stress:3,attack:{bonus:"+3",weapon:"爪击",range:"邻近",damage:"1d12+2 物理",line:"攻击：+3 | 爪击：邻近 | 1d12+2 物理"},experiences:"震动感知+2",description:"一只马匹大小的昆虫，具备掘地利爪与酸性血液。",motives:"掘地、拖走、进食、重新定位",tierNote:"",features:[{name:"无情 Relentless（3） - 被动",desc:"在每个游戏主持人轮次中，此敌人可以至多被聚焦 3 次。像往常一样花费恐惧点来聚焦。"},{name:"破土而出 Earth Eruption - 动作",desc:"标记 1 压力点使酸液掘地者从地面中猛然冲出。邻近范围内的所有生物必须进行一次成功的敏捷反应掷骰，否则将被击倒，且在下次行动前处于 脆弱 状态。"},{name:"喷吐酸液 Spit Acid - 动作",desc:"对酸液掘地者前方近距离范围内的所有目标进行一次攻击。酸液掘地者成功攻击的目标受到 2d6 点物理伤害，并且必须标记 1 护甲槽，但无法获得其收益（其仍然可以继续使用护甲来减少伤害）。如果其无法标记护甲槽，则必须额外标记 1 生命点，并且你获得 1 恐惧点。"},{name:"酸液沐浴 Acid Bath - 反应",desc:"当酸液掘地者受到严重伤害时，邻近范围内的所有生物都会沐浴在其喷洒的酸性血液中，受到 1d10 点物理伤害。其血液飞溅，覆盖了邻近范围内的地面，除了酸液掘地者掘地者以外，所有穿过该区域的生物受到 1d6 点物理伤害。"}],url:"https://daggerheart.huijiwiki.com/wiki/%E9%85%B8%E6%B6%B2%E6%8E%98%E5%9C%B0%E8%80%85"},{id:"%E7%86%8A",name:"熊",original:"BEAR",tier:1,type:"斗士",difficulty:14,thresholds:[9,17],hp:7,stress:2,attack:{bonus:"+1",weapon:"爪击",range:"近战",damage:"1d8+3 物理",line:"攻击：+1 | 爪击：近战 | 1d8+3 物理"},experiences:"伏击者+3，敏锐感知+2",description:"一只毛皮厚实、爪子强有力的巨熊。",motives:"攀爬、保卫领地、猛击、追踪",tierNote:"",features:[{name:"压倒性力量 Overwhelming Force - 被动",desc:"被熊的普通攻击中且标记生命点的目标会被击退至邻近范围。"},{name:"啃咬 Bite - 动作",desc:"标记 1 压力点对近战范围内的一个目标进行一次攻击。成功时，造成 3d4+10 点物理伤害，并且使目标处于 束缚 状态，直到其进行一次成功的力量掷骰挣脱。"},{name:"乘胜追击 Momentum - 反应",desc:"当熊成功命中玩家角色时，你获得 1 恐惧点。"}],url:"https://daggerheart.huijiwiki.com/wiki/%E7%86%8A"},{id:"%E6%B4%9E%E7%A9%B4%E9%A3%9F%E4%BA%BA%E9%AD%94",name:"洞穴食人魔",original:"CAVE OGRE",tier:1,type:"独狼",difficulty:13,thresholds:[8,15],hp:8,stress:3,attack:{bonus:"+1",weapon:"木棒",range:"邻近",damage:"1d10+2 物理",line:"攻击：+1 | 木棒：邻近 | 1d10+2 物理"},experiences:"投掷+2",description:"一个巨大的类人生物，视一切知性生物为食物。",motives:"咬掉头颅、进食、撕扯肢体、践踏、投掷敌人",tierNote:"",features:[{name:"蓄力 Ramp Up - 被动",desc:"你必须花费 1 恐惧点来聚焦食人魔。在被聚焦期间，其可以对范围内所有目标进行普通攻击。"},{name:"碎骨者 Bone Breaker - 被动",desc:"食人魔的攻击造成直接伤害。"},{name:"巨石冰雹 Hail of Boulder - 动作",desc:"标记 1 压力点来拾起重物，并将其投掷向食人魔前方远距离范围内的所有目标。对这些目标进行一次攻击。食人魔成功攻击的目标承受 1d10+2 点物理伤害。如果食人魔成功攻击了多于一个目标，你获得 1 恐惧点。"},{name:"狂怒践踏 Rampaging Fury - 反应",desc:"当食人魔标记 2 点或更多生命点时，其可以进行践踏。将食人魔移动至近距离范围内的一个点，并对其移动路径上的所有目标造成 2d6+3 点直接物理伤害。"}],url:"https://daggerheart.huijiwiki.com/wiki/%E6%B4%9E%E7%A9%B4%E9%A3%9F%E4%BA%BA%E9%AD%94"},{id:"%E6%9E%84%E8%A3%85%E4%BD%93",name:"构装体",original:"CONSTRUCT",tier:1,type:"独狼",difficulty:13,thresholds:[7,15],hp:9,stress:4,attack:{bonus:"+4",weapon:"拳击猛砸",range:"近战",damage:"1d20 物理",line:"攻击：+4 | 拳击猛砸：近战 | 1d20 物理"},experiences:"",description:"一个由石头和钢铁组成的人形生物，由魔法组装并赋予生命。",motives:"破坏环境、为创造者服务、粉碎目标、践踏群体",tierNote:"",features:[{name:"无情 Relentless （2） - 被动",desc:"在每个游戏主持人轮次中，此敌人可以至多被聚焦 2 次。像往常一样花费恐惧点来聚焦。"},{name:"脆弱结构 Weak Structure - 被动",desc:"当构装体因物理伤害标记生命点时，其必须额外标记 1 生命点。"},{name:"践踏 Trample - 动作",desc:"标记 1 压力点在构装体移动时对其路径上的所有目标进行一次攻击。成功命中的目标受到 1d8 点物理伤害。"},{name:"过载 Overload - 反应",desc:"在为构装体的攻击掷骰伤害之前，你可以标记 1 压力点来获得 +10 的伤害掷骰加值。构装体之后可以再次获得聚焦。"},{name:"死亡震荡 Death Quake - 反应",desc:"当构装体标记其最后 1 生命点时，为其提供动力的魔法会因力量的爆发而破裂。对邻近范围内所有目标进行一次具有优势的攻击。构装体成功命中的目标承受 1d12+2 点魔法伤害。"}],url:"https://daggerheart.huijiwiki.com/wiki/%E6%9E%84%E8%A3%85%E4%BD%93"},{id:"%E5%AE%AB%E5%BB%B7%E4%BE%8D%E8%87%A3",name:"宫廷侍臣",original:"COURTIER",tier:1,type:"社交",difficulty:12,thresholds:[4,8],hp:3,stress:4,attack:{bonus:"−4",weapon:"匕首",range:"近战",damage:"1d4+2 物理",line:"攻击：−4 | 匕首：近战 | 1d4+2 物理"},experiences:"社交名流+3",description:"一个野心勃勃、衣着张扬的社交名流。",motives:"抹黑、博取好感、周旋、筹谋",tierNote:"",features:[{name:"嘲讽 Mocker - 动作",desc:"标记 1 压力点出言嘲讽并迫使近距离范围内的一个目标进行一次风度反应掷骰 （14），以查看其是否能挽回颜面。如果失败，目标必须标记 2 压力点并处于 脆弱 状态直到场景结束。"},{name:"替罪羊 Scapegoat - 动作",desc:"花费 1 恐惧点并指定一个玩家角色为目标。宫廷侍臣对一群人或某个显赫人物进行游说，让他们相信目标是他们当前冲突或不幸的根源。"}],url:"https://daggerheart.huijiwiki.com/wiki/%E5%AE%AB%E5%BB%B7%E4%BE%8D%E8%87%A3"},{id:"%E6%B7%B1%E6%A0%B9%E5%AE%88%E5%8D%AB",name:"深根守卫",original:"DEEPROOT DEFENDER",tier:1,type:"斗士",difficulty:10,thresholds:[8,14],hp:7,stress:3,attack:{bonus:"+2",weapon:"藤蔓",range:"近距离",damage:"1d8+3 物理",line:"攻击：+2 | 藤蔓：近距离 | 1d8+3 物理"},experiences:"巨大+3",description:"一个体格壮硕、由植物构成躯体的人形生物，身上长着缠绕藤蔓。",motives:"伏击、抓住、保护、猛击",tierNote:"",features:[{name:"震地猛击 Ground Slam - 动作",desc:"猛击地面，将邻近范围内的所有目标击退至远距离范围。每个因此被击退的目标必须标记 1 压力点。"},{name:"擒拿拖拽 Grab and Drag - 动作",desc:"对近距离范围内的一个目标进行一次攻击。成功时，花费 1 恐惧点将其拉入近战范围，造成 1d6+2 点物理伤害，并使其处于 束缚 状态，直到深根守卫受到严重伤害。"}],url:"https://daggerheart.huijiwiki.com/wiki/%E6%B7%B1%E6%A0%B9%E5%AE%88%E5%8D%AB"},{id:"%E6%81%90%E7%8B%BC",name:"恐狼",original:"DIRE WOLF",tier:1,type:"潜伏",difficulty:12,thresholds:[5,9],hp:4,stress:3,attack:{bonus:"+2",weapon:"爪击",range:"近战",damage:"1d6+2 物理",line:"攻击：+2 | 爪击：近战 | 1d6+2 物理"},experiences:"敏锐感知+3",description:"一只利齿森然的大型狼，鲜少独自出现。",motives:"保卫领地、骚扰、保护族群、包围、尾随",tierNote:"",features:[{name:"群体战术 Pack Tactics - 被动",desc:"如果恐狼进行一次成功的普通攻击，且另一个恐狼在目标的近战范围内，则造成 1d6+5 点物理伤害，而非其普通伤害，并且你获得 1 恐惧点。"},{name:"蹒跚打击 Hobbling Strike - 动作",desc:"标记 1 压力点，对近战范围内的一个目标进行一次攻击。成功时，造成 3d4+10 点直接物理伤害，并使其处于脆弱状态，直到其恢复至少 1 生命点。"}],url:"https://daggerheart.huijiwiki.com/wiki/%E6%81%90%E7%8B%BC"},{id:"%E5%B7%A8%E8%9A%8A%E7%BE%A4",name:"巨蚊群",original:"GIANT MOSQUITOES",tier:1,type:"集群",difficulty:10,thresholds:[5,9],hp:6,stress:3,attack:{bonus:"-2",weapon:"口器",range:"近战",damage:"1d8+3 物理",line:"攻击：-2 | 口器：近战 | 1d8+3 物理"},experiences:"伪装+2",description:"数十只拳头大小的蚊子，成群飞行为求自保。",motives:"飞走、烦扰、吸血",tierNote:"",features:[{name:"集群 Horde（1d4+1） - 被动",desc:"当巨蚊群已标记一半或更多的生命点时，其普通攻击改为造成 1d4+1点物理伤害。"},{name:"飞行 Flying - 被动",desc:"飞行时，巨蚊群的难度获得 +2 加值。"},{name:"吸血 Bloodsucker - 反应",desc:"当巨蚊群的攻击导致目标标记生命点时，你可以标记 1 压力点迫使目标额外标记 1 生命点。"}],url:"https://daggerheart.huijiwiki.com/wiki/%E5%B7%A8%E8%9A%8A%E7%BE%A4"},{id:"%E5%B7%A8%E8%9D%8E",name:"巨蝎",original:"GIANT SCORPION",tier:1,type:"斗士",difficulty:13,thresholds:[7,13],hp:6,stress:3,attack:{bonus:"+1",weapon:"螯",range:"近战",damage:"1d12+2 物理",line:"攻击：+1 | 螯：近战 | 1d12+2 物理"},experiences:"伪装+2",description:"一只人类大小的昆虫，长有撕裂的螯和带刺的尾巴。",motives:"伏击、进食、缠斗、下毒",tierNote:"",features:[{name:"双重打击 Double Strike - 动作",desc:"标记 1 压力点对近战范围内的两个目标进行一次普通攻击。"},{name:"剧毒尾刺 Venomous Stinger - 动作",desc:"对一个邻近范围内的目标进行一次攻击。成功时，花费 1 恐惧点造成 1d4+4 物理伤害并使其直到下次休息或知识掷骰成功（16）前处于中毒状态。处于中毒状态时，目标在进行动作掷骰前必须掷一个 d6。结果为 4 或更低时，其必须标记 1 压力点。"},{name:"乘胜追击 Momentum - 反应",desc:"当巨蝎成功命中玩家角色时，你获得 1 恐惧点。"}],url:"https://daggerheart.huijiwiki.com/wiki/%E5%B7%A8%E8%9D%8E"},{id:"%E7%8E%BB%E7%92%83%E8%9B%87",name:"玻璃蛇",original:"GLASS SNAKE",tier:1,type:"标准",difficulty:14,thresholds:[6,10],hp:5,stress:3,attack:{bonus:"+2",weapon:"玻璃獠牙",range:"邻近",damage:"1d8+2 物理",line:"攻击：+2 | 玻璃獠牙：邻近 | 1d8+2 物理"},experiences:"",description:"一条晶莹剔透的大蛇，长着巨大的蛇首，所经之处皆留下一串玻璃碎片。",motives:"攀爬、进食、保持距离、恐吓",tierNote:"",features:[{name:"碎甲鳞片 Armor-Shredding Shards - 被动",desc:"在近战范围内对玻璃蛇进行一次成功的攻击时，攻击者必须标记 1 护甲槽，且不获得其效果（其仍然可以使用护甲来减少伤害）。如果无法标记护甲槽，其必须额外标记 1 生命点。"},{name:"盘旋之蛇 Spinning Serpent - 动作",desc:"标记 1 压力点对邻近范围内的所有目标进行一次攻击。被玻璃蛇成功命中的目标受到 1d6+1 物理伤害。"},{name:"毒液喷吐 Spitter - 动作",desc:"花费 1 恐惧点引入一个 d6 喷吐骰。当玻璃蛇被聚焦时，掷出此骰。结果为 5 或更高时，玻璃蛇前方远距离范围内的所有目标必须在一次敏捷反应掷骰中成功，否则将受到 1d4 物理伤害。玻璃蛇可以在该游戏主持人轮次中第二次获得聚焦。"}],url:"https://daggerheart.huijiwiki.com/wiki/%E7%8E%BB%E7%92%83%E8%9B%87"},{id:"%E6%89%B0%E6%95%8C%E8%80%85",name:"扰敌者",original:"HARRIER",tier:1,type:"标准",difficulty:12,thresholds:[5,9],hp:3,stress:3,attack:{bonus:"+1",weapon:"标枪",range:"近距离",damage:"1d6+2 物理",line:"攻击：+1 | 标枪：近距离 | 1d6+2 物理"},experiences:"伪装+2",description:"手持标枪的敏捷战士。",motives:"侧袭、骚扰、游击、获利",tierNote:"",features:[{name:"保持距离 Maintain Distance - 被动",desc:"在进行一次普通攻击后，扰敌者可以移动至远距离范围内的任意位置。"},{name:"撤退回击 Fall Back - 反应",desc:"当一个生物移动到近战范围内进行攻击时，你可以在攻击掷骰之前标记 1 压力点，移动到近距离范围内的任何位置，并对该生物进行一次攻击。成功时，造成 1d10+2 物理伤害。"}],url:"https://daggerheart.huijiwiki.com/wiki/%E6%89%B0%E6%95%8C%E8%80%85"},{id:"%E6%8C%81%E5%BC%93%E8%AD%A6%E5%8D%AB",name:"持弓警卫",original:"ARCHER GUARD",tier:1,type:"远程",difficulty:10,thresholds:[4,8],hp:3,stress:2,attack:{bonus:"+1",weapon:"长弓",range:"远距离",damage:"1d8+3 物理",line:"攻击：+1 | 长弓：远距离 | 1d8+3 物理"},experiences:"本地知识+3",description:"一名高大的卫兵，配备长弓和箭袋，箭上插有所处城镇代表色的箭羽。",motives:"逮捕、封锁城门、熬过今日、压制目标",tierNote:"",features:[{name:"蹒跚射击 Hobbling Shot - 动作",desc:"对远距离范围内的目标进行一次攻击。成功时，标记 1 压力点，造成 1d12+3 物理伤害。如果目标因此次攻击而标记生命点，则其在恢复至少 1 生命点之前，进行敏捷掷骰时具有劣势。"}],url:"https://daggerheart.huijiwiki.com/wiki/%E6%8C%81%E5%BC%93%E8%AD%A6%E5%8D%AB"},{id:"%E9%94%AF%E9%BD%BF%E5%88%80%E5%92%92%E6%9C%AF%E5%B8%88",name:"锯齿刀咒术师",original:"JAGGED KNIFE HEXER",tier:1,type:"辅助",difficulty:13,thresholds:[5,9],hp:4,stress:4,attack:{bonus:"+2",weapon:"法杖",range:"远距离",damage:"1d6+2 魔法",line:"攻击：+2 | 法杖：远距离 | 1d6+2 魔法"},experiences:"魔法知识+2",description:"一名身披缀满魔法器具斗篷的持杖匪徒，擅长用诅咒折磨敌人。",motives:"指挥、施咒、获利",tierNote:"",features:[{name:"诅咒 Curse - 动作",desc:"选择远距离范围内的一个目标，使其暂时处于 诅咒 状态。当处于 诅咒 状态的目标掷出希望结果时，锯齿刀咒术师可标记 1 压力点，使其改为掷出恐惧结果。"},{name:"混沌涌动 Chaotic Flux - 动作",desc:"对邻近范围内至多三个目标发动攻击。标记 1 压力点对每个被咒术师成功命中的目标造成 2d6+3 点魔法伤害。"}],url:"https://daggerheart.huijiwiki.com/wiki/%E9%94%AF%E9%BD%BF%E5%88%80%E5%92%92%E6%9C%AF%E5%B8%88"},{id:"%E9%94%AF%E9%BD%BF%E5%88%80%E7%A2%8E%E8%86%9D%E8%80%85",name:"锯齿刀碎膝者",original:"JAGGED KNIFE KNEEBREAKER",tier:1,type:"斗士",difficulty:12,thresholds:[7,14],hp:7,stress:4,attack:{bonus:"−3",weapon:"木棒",range:"近战",damage:"1d4+6 物理",line:"攻击：−3 | 木棒：近战 | 1d4+6 物理"},experiences:"盗贼+2，展露威胁+3",description:"一名手持巨棒的威猛斗士。",motives:"缠斗、威吓、获利、偷窃",tierNote:"",features:[{name:"我逮住他们了 I've Got 'Em - 被动",desc:"被锯齿刀碎膝者 束缚 的生物，在遭受其他敌人的攻击时将承受双倍伤害。"},{name:"压制目标 Hold Them Down - 动作",desc:"对近战范围内的一个目标发动一次攻击。若成功命中，目标不会受到伤害但会处于 束缚 和 脆弱 状态。目标可通过成功的力量掷骰来挣脱（同时清除两种状态），或当锯齿刀碎膝者受到重度及以上伤害时自动获得自由。"}],url:"https://daggerheart.huijiwiki.com/wiki/%E9%94%AF%E9%BD%BF%E5%88%80%E7%A2%8E%E8%86%9D%E8%80%85"},{id:"%E9%94%AF%E9%BD%BF%E5%88%80%E5%96%BD%E5%95%B0",name:"锯齿刀喽啰",original:"JAGGED KNIFE LACKEY",tier:1,type:"杂兵",difficulty:9,thresholds:[null,null],hp:1,stress:1,attack:{bonus:"−2",weapon:"匕首",range:"近战",damage:"2 物理",line:"攻击：−2 | 匕首：近战 | 2 物理"},experiences:"盗贼+2",description:"一个穿着朴素、手持小匕首的盗贼，渴望证明自己。",motives:"逃跑、牟利、投掷烟雾弹",tierNote:"",features:[{name:"杂兵 Minion （3） - 被动",desc:"当锯齿刀喽啰受到任何伤害时，其即被击败。玩家角色每对锯齿刀喽啰造成 3 点伤害，则在攻击能够成功命中的范围内额外击败一个杂兵。"},{name:"群体攻击 Group Attack - 动作",desc:"花费 1 恐惧点，选择一个目标，并聚焦目标近距离范围内的所有锯齿刀喽啰。将这些杂兵移动到目标的近战范围内，并进行一次共享攻击掷骰。成功时，每个锯齿刀喽啰造成 2 点物理伤害。将这些伤害合并计算。"}],url:"https://daggerheart.huijiwiki.com/wiki/%E9%94%AF%E9%BD%BF%E5%88%80%E5%96%BD%E5%95%B0"},{id:"%E9%94%AF%E9%BD%BF%E5%88%80%E9%98%9F%E9%95%BF",name:"锯齿刀队长",original:"JAGGED KNIFE LIEUTENANT",tier:1,type:"头目",difficulty:13,thresholds:[7,14],hp:6,stress:3,attack:{bonus:"+2",weapon:"标枪",range:"近距离",damage:"1d8+3 物理",line:"攻击：+2 | 标枪：近距离 | 1d8+3 物理"},experiences:"本地知识+2",description:"一位经验丰富的强盗，身着优质皮甲，嗓音洪亮，目光狡黠。",motives:"霸凌、指挥、获利、增援",tierNote:"",features:[{name:"战术大师 Tactician - 动作",desc:"当你聚焦锯齿刀队长时，标记 1 压力点，可额外聚焦近距离范围内的两名盟友。"},{name:"后援不断 More Where That Came From - 动作",desc:"召唤三名“锯齿刀喽啰”，他们出现在远距离范围处。"},{name:"致命一击 Coup de Grace - 动作",desc:"花费 1 恐惧点对近距离范围内处于 脆弱 状态的目标发动攻击。命中后造成2d6+12点物理伤害且目标必须标记 1 压力点。"},{name:"乘胜追击 Momentum - 反应",desc:"当锯齿刀队长成功命中玩家角色时，你获得 1 恐惧点。"}],url:"https://daggerheart.huijiwiki.com/wiki/%E9%94%AF%E9%BD%BF%E5%88%80%E9%98%9F%E9%95%BF"},{id:"%E9%94%AF%E9%BD%BF%E5%88%80%E7%8B%99%E5%87%BB%E6%89%8B",name:"锯齿刀狙击手",original:"JAGGED KNIFE SNIPER",tier:1,type:"远程",difficulty:13,thresholds:[4,7],hp:3,stress:2,attack:{bonus:"−1",weapon:"短弓",range:"远距离",damage:"1d10+2 物理",line:"攻击：−1 | 短弓：远距离 | 1d10+2 物理"},experiences:"潜行+2",description:"一名瘦长的强盗，手持短弓，从掩体后发起攻击。",motives:"伏击、隐藏、获利、重新部署",tierNote:"",features:[{name:"未见之击 Unseen Strike - 被动",desc:"如果锯齿刀狙击手在对目标进行成功的普通攻击时处于 隐藏 状态，造成 1d10+4 点物理伤害而非普通伤害。"}],url:"https://daggerheart.huijiwiki.com/wiki/%E9%94%AF%E9%BD%BF%E5%88%80%E7%8B%99%E5%87%BB%E6%89%8B"},{id:"%E5%B0%8F%E5%9E%8B%E6%B7%B7%E6%B2%8C%E5%85%83%E7%B4%A0",name:"小型混沌元素",original:"MINOR CHAOS ELEMENTAL",tier:1,type:"独狼",difficulty:14,thresholds:[7,14],hp:7,stress:3,attack:{bonus:"+3",weapon:"扭曲爆破",range:"近距离",damage:"1d12+6 魔法",line:"攻击：+3 | 扭曲爆破：近距离 | 1d12+6 魔法"},experiences:"",description:"一团闪烁不定的、无法控制的魔法元素。",motives:"迷惑、破坏稳定、变形",tierNote:"",features:[{name:"奥术形态 Arcane Form - 被动",desc:"元素具有魔法伤害抗性。"},{name:"致病洪流 Sickening Flux - 动作",desc:"标记 1 生命点，迫使近距离范围内的所有目标标记 1 压力点并处于 脆弱 状态，直到其下次休息或恢复 1 生命点。"},{name:"重塑现实 Remake Reality - 动作",desc:"花费 1 恐惧点，将邻近范围内的区域转化为不同的生物群落。此区域内的所有目标受到 2d6+3 点直接魔法伤害。"},{name:"魔法反射 Magical Reflection - 反应",desc:"当小型混沌元素在近距离范围内受到攻击伤害时，对攻击者造成相当于其所造成伤害一半的伤害。"},{name:"乘胜追击 Momentum - 反应",desc:"当小型混沌元素成功命中玩家角色时，你获得 1 恐惧点。"}],url:"https://daggerheart.huijiwiki.com/wiki/%E5%B0%8F%E5%9E%8B%E6%B7%B7%E6%B2%8C%E5%85%83%E7%B4%A0"},{id:"%E5%B0%8F%E5%9E%8B%E7%81%AB%E5%85%83%E7%B4%A0",name:"小型火元素",original:"MINOR FIRE ELEMENTAL",tier:1,type:"独狼",difficulty:13,thresholds:[7,15],hp:9,stress:3,attack:{bonus:"+3",weapon:"元素爆破",range:"远距离",damage:"1d10+4 魔法",line:"攻击：+3 | 元素爆破：远距离 | 1d10+4 魔法"},experiences:"",description:"一团如篝火般大小的活体火焰。",motives:"包围敌人、增大体型、威吓、纵火",tierNote:"",features:[{name:"无情 Relentless （2） - 被动",desc:"在每个游戏主持人轮次中，此敌人可以至多被聚焦 2 次。像往常一样花费恐惧点来聚焦。"},{name:"焦土 Scorched Earth - 动作",desc:"标记 1 压力点，选择远距离范围内的任意一点。该点邻近范围内的地面立即燃起火焰。此区域内的所有生物必须进行一次敏捷反应掷骰。失败的目标受到火焰造成的 2d8 点魔法伤害。成功的目标受到一半伤害。"},{name:"爆炸 Explosion - 动作",desc:"花费 1 恐惧点，引发一场烈焰爆炸。对近距离范围内的所有目标进行一次攻击。成功命中的目标受到 1d8 点魔法伤害并被击退至远距离范围。"},{name:"吞噬引燃物 Consume Kindling - 反应",desc:"每场景三次，当小型火元素移动到高度易燃的物体上时，吞噬它以恢复 1 生命点或清除 1 压力点。"},{name:"乘胜追击 Momentum - 反应",desc:"当小型火元素成功命中玩家角色时，你获得 1 恐惧点。"}],url:"https://daggerheart.huijiwiki.com/wiki/%E5%B0%8F%E5%9E%8B%E7%81%AB%E5%85%83%E7%B4%A0"},{id:"%E5%B0%8F%E5%9E%8B%E6%81%B6%E9%AD%94",name:"小型恶魔",original:"MINOR DEMON",tier:1,type:"独狼",difficulty:14,thresholds:[8,15],hp:8,stress:4,attack:{bonus:"+3",weapon:"利爪",range:"近战",damage:"1d8+6 物理",line:"攻击：+3 | 利爪：近战 | 1d8+6 物理"},experiences:"",description:"来自轮回下界的深红生物，对一切凡世生灵怀有怒火。",motives:"行动无常，围堵目标，以痛苦为乐，折磨",tierNote:"",features:[{name:"无情 Relentless （2） - 被动",desc:"在每个游戏主持人轮次中，此敌人可以至多被聚焦 2 次。像往常一样花费恐惧点来聚焦。"},{name:"万物皆陨 All Must Fall - 被动",desc:"当一个玩家角色在小型恶魔的近距离范围内掷出恐惧失败时，其失去 1 希望点。"},{name:"地狱火 Hellfire - 动作",desc:"花费 1 恐惧点，在远距离范围内降下地狱火。区域内的所有目标必须进行一次敏捷反应掷骰。失败的目标受到 1d20+3 点魔法伤害。成功的目标受到一半伤害。"},{name:"收割者 Reaper - 反应",desc:"在为小型恶魔的攻击进行伤害掷骰之前，你可以标记 1 压力点，以获得一个等于小型恶魔当前标记生命点数的伤害掷骰加值。"},{name:"乘胜追击 Momentum - 反应",desc:"当小型恶魔成功命中玩家角色时，你获得 1 恐惧点。"}],url:"https://daggerheart.huijiwiki.com/wiki/%E5%B0%8F%E5%9E%8B%E6%81%B6%E9%AD%94"},{id:"%E5%B0%8F%E5%9E%8B%E6%A0%91%E4%BA%BA",name:"小型树人",original:"MINOR TREANT",tier:1,type:"杂兵",difficulty:10,thresholds:[null,null],hp:1,stress:1,attack:{bonus:"−2",weapon:"利爪树枝",range:"近战",damage:"4 物理",line:"攻击：−2 | 利爪树枝：近战 | 4 物理"},experiences:"",description:"一株能移动的树苗，起身保卫自己的森林。",motives:"粉碎、制服、保护",tierNote:"",features:[{name:"杂兵 Minion （5） - 被动",desc:"当小型树人受到任何伤害时，其即被击败。玩家角色每对小型树人造成 5 点伤害，则在攻击能够成功命中的范围内额外击败一个杂兵。"},{name:"群体攻击 Group Attack - 动作",desc:"花费 1 恐惧点，选择一个目标，并聚焦目标近距离范围内的所有小型树人。将这些小型树人移动到目标的近战范围内，并进行一次共享攻击掷骰。成功时，每个小型树人造成 4 点伤害。将这些伤害合并计算。"}],url:"https://daggerheart.huijiwiki.com/wiki/%E5%B0%8F%E5%9E%8B%E6%A0%91%E4%BA%BA"},{id:"%E7%BB%BF%E8%89%B2%E8%BD%AF%E6%B3%A5%E6%80%AA",name:"绿色软泥怪",original:"GREEN OOZE",tier:1,type:"潜伏",difficulty:8,thresholds:[5,10],hp:5,stress:2,attack:{bonus:"+1",weapon:"软泥附肢",range:"近战",damage:"1d6+1 魔法",line:"攻击：+1 | 软泥附肢：近战 | 1d6+1 魔法"},experiences:"伪装+3",description:"一团蠕动的半透明绿色粘液团块。",motives:"伪装、吞噬并繁殖、悄悄靠近、吞没",tierNote:"",features:[{name:"迟缓 Slow - 被动",desc:"当你聚焦绿色软泥怪，且其数据块上没有指示物时，它无法立即行动。在其数据块上放置一个标记，并描述它正在准备做什么。当你聚焦软泥怪，且其数据块上有指示物时，移除指示物，它才可以行动。"},{name:"酸性形态 Acidic Form - 被动",desc:"当绿色软泥怪攻击成功时，目标必须标记 1 护甲槽，且不获得其效果（其仍然可以使用护甲来减少伤害）。如果目标无法标记护甲槽，则必须额外标记 1 生命点。"},{name:"吞没 Envelop - 动作",desc:"对近战范围内的一个目标进行一次普通攻击。成功时，绿色软泥怪会吞没该目标，目标必须标记 2 压力点。被吞没期间，目标每次进行动作掷骰时都必须额外标记 1 压力点。当绿色软泥怪受到重伤时，所有被吞没的目标都会被解放，且该状态被清除。"},{name:"分裂 Split - 反应",desc:"当绿色软泥怪标记了 3 或更多生命点时，你可以花费 1 恐惧点将其分裂成两个微型绿色软泥怪（没有标记的生命点或压力点），并立即聚焦。"}],url:"https://daggerheart.huijiwiki.com/wiki/%E7%BB%BF%E8%89%B2%E8%BD%AF%E6%B3%A5%E6%80%AA"},{id:"%E5%BE%AE%E5%9E%8B%E7%BB%BF%E8%89%B2%E8%BD%AF%E6%B3%A5%E6%80%AA",name:"微型绿色软泥怪",original:"TINY GREEN OOZE",tier:1,type:"潜伏",difficulty:14,thresholds:[4,null],hp:2,stress:1,attack:{bonus:"-1",weapon:"软泥附肢",range:"近战",damage:"1d4+1 魔法",line:"攻击：-1 | 软泥附肢：近战 | 1d4+1 魔法"},experiences:"",description:"一小团蠕动的半透明绿色粘液团块。",motives:"伪装、悄悄靠近",tierNote:"",features:[{name:"酸性形态 Acidic Form - 被动",desc:"当微型绿色软泥怪攻击成功时，目标必须标记 1 护甲槽，且不获得其效果（其仍然可以使用护甲来减少伤害）。如果目标无法标记护甲槽，则必须额外标记 1 生命点。"}],url:"https://daggerheart.huijiwiki.com/wiki/%E5%BE%AE%E5%9E%8B%E7%BB%BF%E8%89%B2%E8%BD%AF%E6%B3%A5%E6%80%AA"},{id:"%E7%BA%A2%E8%89%B2%E8%BD%AF%E6%B3%A5%E6%80%AA",name:"红色软泥怪",original:"RED OOZE",tier:1,type:"潜伏",difficulty:10,thresholds:[6,11],hp:5,stress:3,attack:{bonus:"+1",weapon:"软泥附肢",range:"近战",damage:"1d8+3 魔法",line:"攻击：+1 | 软泥附肢：近战 | 1d8+3 魔法"},experiences:"伪装+3",description:"一团燃烧着的蠕动半透明红色粘液团块。",motives:"伪装、吞噬并繁殖、点燃、纵火",tierNote:"",features:[{name:"蔓延之火 Creeping Fire - 被动",desc:"红色软泥怪只能在邻近范围内进行正常移动。它会点燃任何接触到的易燃物体。"},{name:"点燃 Ignite - 动作",desc:"对邻近范围内的一个目标进行攻击。成功时，目标受到 1d8 魔法伤害并处于 点燃 状态，直到成功进行灵巧掷骰（14）将其扑灭。处于 点燃 状态时，目标在进行动作掷骰时受到 1d4 魔法伤害。"},{name:"分裂 Split - 反应",desc:"当红色软泥怪标记了 3 或更多生命点时，你可以花费 1 恐惧点将其分裂成两个微型红色软泥怪（没有标记的生命点或压力点），并立即聚焦。"}],url:"https://daggerheart.huijiwiki.com/wiki/%E7%BA%A2%E8%89%B2%E8%BD%AF%E6%B3%A5%E6%80%AA"},{id:"%E5%BE%AE%E5%9E%8B%E7%BA%A2%E8%89%B2%E8%BD%AF%E6%B3%A5%E6%80%AA",name:"微型红色软泥怪",original:"TINY RED OOZE",tier:1,type:"潜伏",difficulty:11,thresholds:[5,null],hp:2,stress:1,attack:{bonus:"−1",weapon:"软泥附肢",range:"近战",damage:"1d4+2 魔法",line:"攻击：−1 | 软泥附肢：近战 | 1d4+2 魔法"},experiences:"",description:"一小团燃烧着的蠕动半透明红色粘液团块。",motives:"燃烧、伪装",tierNote:"",features:[{name:"燃烧 Burning - 反应",desc:"当近战范围内的生物对微型红色软泥怪造成伤害时，其受到 1d6 点直接魔法伤害。"}],url:"https://daggerheart.huijiwiki.com/wiki/%E5%BE%AE%E5%9E%8B%E7%BA%A2%E8%89%B2%E8%BD%AF%E6%B3%A5%E6%80%AA"},{id:"%E4%BD%8E%E9%98%B6%E8%B4%B5%E6%97%8F",name:"低阶贵族",original:"PETTY NOBLE",tier:1,type:"社交",difficulty:14,thresholds:[6,10],hp:3,stress:5,attack:{bonus:"−3",weapon:"细剑",range:"近战",damage:"1d6+1 物理",line:"攻击：−3 | 细剑：近战 | 1d6+1 物理"},experiences:"贵族+3",description:"一位衣着华贵、珠光宝气且浑身散发着傲慢气息的贵族。",motives:"滥用权力、搜集资源、调动杂兵",tierNote:"",features:[{name:"我的地盘我做主 My Land, My Rules - 被动",desc:"在该贵族的领地上针对该贵族进行的所有社交动作均处于劣势。"},{name:"卫兵，拿下他们！ Guards, Seize Them！ - 动作",desc:"每场景一次，标记 1 压力点以召唤 1d4 名持刃警卫，出现在远距离范围，执行贵族的意志。"},{name:"流放 Exile - 动作",desc:"花费 1 恐惧点并指定一个玩家角色。贵族宣布目标及其盟友被流放出贵族的领地。在被流放期间，目标及其盟友在贵族领地内的社交场合中处于劣势。"}],url:"https://daggerheart.huijiwiki.com/wiki/%E4%BD%8E%E9%98%B6%E8%B4%B5%E6%97%8F"},{id:"%E6%B5%B7%E7%9B%97%E8%88%B9%E9%95%BF",name:"海盗船长",original:"PIRATE CAPTAIN",tier:1,type:"头目",difficulty:14,thresholds:[7,14],hp:7,stress:5,attack:{bonus:"+4",weapon:"弯刀",range:"近战",damage:"1d12+2 物理",line:"攻击：+4 | 弯刀：近战 | 1d12+2 物理"},experiences:"指挥官+2，水手+3",description:"一位头戴华丽帽子，魅力非凡的海盗，热衷于劫掠与掠夺。",motives:"指挥、逼人走跳板、劫掠、突袭",tierNote:"",features:[{name:"豪侠气概 Swashbuckler - 被动",desc:"当海盗船长在近战范围内受到攻击，并标记 2 或更少生命点时，攻击者必须标记 1 压力点。"},{name:"增援 Reinforcements - 动作",desc:"每场景一次，标记 1 压力点以召唤一支海盗劫掠者集群，他们出现在远距离范围位置。"},{name:"不留活口 No Quarter - 动作",desc:"花费 1 恐惧点选择一个近战范围内有三名及以上海盗存在的目标。海盗船长带领海盗们发出威胁要将目标扔进大海。目标必须进行一次风度反应掷骰。失败时，标记 1d4+1 压力点。成功时，目标必须标记 1 压力点。"},{name:"乘胜追击 Momentum - 反应",desc:"当海盗船长成功命中玩家角色时，你获得 1 恐惧点。"}],url:"https://daggerheart.huijiwiki.com/wiki/%E6%B5%B7%E7%9B%97%E8%88%B9%E9%95%BF"},{id:"%E6%B5%B7%E7%9B%97%E5%8A%AB%E6%8E%A0%E8%80%85",name:"海盗劫掠者",original:"PIRATE RAIDERS",tier:1,type:"集群",difficulty:12,thresholds:[5,11],hp:4,stress:3,attack:{bonus:"+1",weapon:"弯刀",range:"近战",damage:"1d8+2 物理",line:"攻击：+1 | 弯刀：近战 | 1d8+2 物理"},experiences:"水手+3",description:"成群结队的海上恶徒，如狼群般肆虐横行。",motives:"围攻、劫掠、突袭",tierNote:"",features:[{name:"集群 Horde （1d4+1） - 被动",desc:"当海盗劫掠者已标记一半或更多的生命点时，其普通攻击改为造成 1d4+1 点物理伤害。"},{name:"豪侠气概 Swashbuckler - 被动",desc:"当海盗劫掠者在近战范围内受到攻击，并标记 2 或更少生命点时，攻击者必须标记 1 压力点。"}],url:"https://daggerheart.huijiwiki.com/wiki/%E6%B5%B7%E7%9B%97%E5%8A%AB%E6%8E%A0%E8%80%85"},{id:"%E6%B5%B7%E7%9B%97%E6%89%93%E6%89%8B",name:"海盗打手",original:"PIRATE TOUGH",tier:1,type:"斗士",difficulty:13,thresholds:[8,15],hp:5,stress:3,attack:{bonus:"+1",weapon:"巨拳",range:"近战",damage:"2d6 物理",line:"攻击：+1 | 巨拳：近战 | 2d6 物理"},experiences:"水手+2",description:"一个肌肉发达、满身纹身、拳头有甜瓜大小的海盗。",motives:"劫掠、突袭、重击、胁迫",tierNote:"",features:[{name:"豪侠气概 Swashbuckler - 被动",desc:"当海盗打手在近战范围内受到攻击，并标记 2 或更少生命点时，攻击者必须标记 1 压力点。"},{name:"清理甲板 Clear the Decks - 动作",desc:"对邻近范围内的一个目标进行一次攻击。成功时，标记 1 压力点并移动到目标的近战范围内，造成 3d4 点物理伤害并将目标击退至近距离范围。"}],url:"https://daggerheart.huijiwiki.com/wiki/%E6%B5%B7%E7%9B%97%E6%89%93%E6%89%8B"},{id:"%E9%9B%87%E4%BD%A3%E5%89%91%E5%AE%A2",name:"雇佣剑客",original:"SELLSWORD",tier:1,type:"杂兵",difficulty:10,thresholds:[null,null],hp:1,stress:1,attack:{bonus:"+3",weapon:"长剑",range:"近战",damage:"3 物理",line:"攻击：+3 | 长剑：近战 | 3 物理"},experiences:"",description:"全副武装的佣兵正在赌上自己的运气。",motives:"冲锋、砍伤、制服、获利",tierNote:"",features:[{name:"杂兵 Minion （4） - 被动",desc:"当雇佣剑客受到任何伤害时，其即被击败。玩家角色每对雇佣剑客造成 4 点伤害，则在攻击能够成功命中的范围内额外击败一个杂兵"},{name:"群体攻击 Group Attack - 动作",desc:"花费 1 恐惧点，选择一个目标，并聚焦目标近距离范围内的所有雇佣剑客。将这些雇佣剑客移动到目标的近战范围内，并进行一次共享攻击掷骰。成功时，每个雇佣剑客造成 3 点伤害。将这些伤害合并计算。"}],url:"https://daggerheart.huijiwiki.com/wiki/%E9%9B%87%E4%BD%A3%E5%89%91%E5%AE%A2"},{id:"%E9%AA%B7%E9%AB%85%E5%BC%93%E6%89%8B",name:"骷髅弓手",original:"SKELETON ARCHER",tier:1,type:"远程",difficulty:9,thresholds:[4,7],hp:3,stress:2,attack:{bonus:"+2",weapon:"短弓",range:"远距离",damage:"1d8+1 物理",line:"攻击：+2 | 短弓：远距离 | 1d8+1 物理"},experiences:"",description:"一个脆弱的骷髅，带着一把短弓和箭。",motives:"射穿分心的目标、装死、偷窃皮肤",tierNote:"",features:[{name:"机会主义者 Opportunist - 被动",desc:"当两个或更多敌人位于一个生物的邻近范围内时，骷髅弓手对该生物造成的所有伤害翻倍。"},{name:"致命射击 Deadly Shot - 动作",desc:"对远距离范围内一个处于 脆弱 状态的目标进行一次攻击。成功时，标记 1 压力点，造成 3d4+8 点物理伤害。"}],url:"https://daggerheart.huijiwiki.com/wiki/%E9%AA%B7%E9%AB%85%E5%BC%93%E6%89%8B"},{id:"%E7%A0%B4%E5%9C%9F%E9%AA%B7%E9%AB%85",name:"破土骷髅",original:"SKELETON DREDGE",tier:1,type:"杂兵",difficulty:8,thresholds:[null,null],hp:1,stress:1,attack:{bonus:"−1",weapon:"骨爪",range:"近战",damage:"1 物理",line:"攻击：−1 | 骨爪：近战 | 1 物理"},experiences:"",description:"一堆喀啦作响的骨头。",motives:"散架、压制、装死、偷窃皮肤",tierNote:"",features:[{name:"杂兵 Minion （4） - 被动",desc:"当破土骷髅受到任何伤害时，其即被击败。玩家角色每对破土骷髅造成 4 点伤害，则在攻击能够成功命中的范围内额外击败一个杂兵。"},{name:"群体攻击 Group Attack - 动作",desc:"花费 1 恐惧点，选择一个目标，并聚焦目标近距离范围内的所有破土骷髅。将这些破土骷髅移动到目标的近战范围内，并进行一次共享攻击掷骰。成功时，每个破土骷髅造成 1 点伤害。将这些伤害合并计算。"}],url:"https://daggerheart.huijiwiki.com/wiki/%E7%A0%B4%E5%9C%9F%E9%AA%B7%E9%AB%85"},{id:"%E9%AA%B7%E9%AB%85%E9%AA%91%E5%A3%AB",name:"骷髅骑士",original:"SKELETON KNIGHT",tier:1,type:"斗士",difficulty:13,thresholds:[7,13],hp:5,stress:2,attack:{bonus:"+2",weapon:"生锈巨剑",range:"近战",damage:"1d10+2 物理",line:"攻击：+2 | 生锈巨剑：近战 | 1d10+2 物理"},experiences:"",description:"一个身披重甲、手持巨刃的大型骷髅。",motives:"斩杀生者、偷窃皮肤、大肆破坏",tierNote:"",features:[{name:"惊怖 Terrifying - 被动",desc:"当骷髅骑士成功攻击时，所有近距离范围内的玩家角色失去 1 希望点，而你获得 1 恐惧点。"},{name:"斩骨 Cut to the Bone - 动作",desc:"标记 1 压力点，对邻近范围内的所有目标进行一次攻击。骷髅骑士成功攻击的目标受到 1d8+2 点物理伤害，并且必须标记 1 压力点。"},{name:"掘双墓 Dig Two Graves - 反应",desc:"当骷髅骑士被击败时，它对邻近范围内的一个目标（优先选择击败它的生物）进行一次攻击。成功时，目标受到 1d4+8 点物理伤害并失去 1d4 希望点。"}],url:"https://daggerheart.huijiwiki.com/wiki/%E9%AA%B7%E9%AB%85%E9%AA%91%E5%A3%AB"},{id:"%E9%AA%B7%E9%AB%85%E6%88%98%E5%A3%AB",name:"骷髅战士",original:"SKELETON WARRIOR",tier:1,type:"标准",difficulty:10,thresholds:[4,8],hp:3,stress:2,attack:{bonus:"+0",weapon:"剑",range:"近战",damage:"1d6+2 物理",line:"攻击：+0 | 剑：近战 | 1d6+2 物理"},experiences:"",description:"一个浑身沾土、手持生锈刀刃的骷髅。",motives:"装死、围攻、偷窃皮肤",tierNote:"",features:[{name:"仅剩枯骨 Only Bones - 被动",desc:"骷髅战士对物理伤害具有抗性。"},{name:"不会死透 Won't Stay Dead - 反应",desc:"当骷髅战士被击败时，你可以聚焦它并投掷一个 d6。结果为 6 时，如果战场上还有其他敌人，骷髅战士将重组并移除所有已标记的生命点。"}],url:"https://daggerheart.huijiwiki.com/wiki/%E9%AA%B7%E9%AB%85%E6%88%98%E5%A3%AB"},{id:"%E5%92%92%E5%89%91%E5%A3%AB",name:"咒剑士",original:"SPELLBLADE",tier:1,type:"头目",difficulty:14,thresholds:[8,14],hp:6,stress:3,attack:{bonus:"+3",weapon:"强化长剑",range:"近战",damage:"1d8+4 物理魔法",line:"攻击：+3 | 强化长剑：近战 | 1d8+4 物理魔法"},experiences:"魔法知识+2",description:"一个将剑术与魔法结合、造成致命效果的雇佣兵。",motives:"冲击、指挥、忍耐",tierNote:"",features:[{name:"奥术锋刃 Arcane Steel - 被动",desc:"咒剑士普通攻击造成的伤害同时视为物理和魔法伤害。"},{name:"压制冲击 Suppressing Blast - 动作",desc:"标记 1 压力点并选择远距离范围内的一组目标。所有目标必须在敏捷反应掷骰中成功，否则受到 1d8+2 点魔法伤害。每有一个目标因此次攻击标记生命点，你获得 1 恐惧点。"},{name:"协同行动 Move as a Unit - 动作",desc:"花费 2 恐惧点聚焦远距离范围内至多 5 个盟友。"},{name:"乘胜追击 Momentum - 反应",desc:"当咒剑士成功命中玩家角色时，你获得 1 恐惧点。"}],url:"https://daggerheart.huijiwiki.com/wiki/%E5%92%92%E5%89%91%E5%A3%AB"},{id:"%E9%BC%A0%E7%BE%A4",name:"鼠群",original:"SWARM OF RATS",tier:1,type:"集群",difficulty:10,thresholds:[6,10],hp:6,stress:2,attack:{bonus:"−3",weapon:"爪击",range:"近战",damage:"1d8+2 物理",line:"攻击：−3 | 爪击：近战 | 1d8+2 物理"},experiences:"",description:"一群普通的啮齿动物如同贪婪的浪潮般协同移动，形成令人毛骨悚然的群体。",motives:"吞噬、遮蔽、集群",tierNote:"（10/生命点）",features:[{name:"集群 Horde （1d4+1） - 被动",desc:"当鼠群已标记一半或更多的生命点时，其普通攻击改为造成 1d4+1 点物理伤害。"},{name:"扑面而来 In Your Face - 被动",desc:"近战范围内的所有目标在攻击鼠群以外的目标时处于劣势。"}],url:"https://daggerheart.huijiwiki.com/wiki/%E9%BC%A0%E7%BE%A4"},{id:"%E6%9C%A8%E6%97%8F%E6%88%98%E5%A3%AB",name:"木族战士",original:"SYLVAN SOLDIER",tier:1,type:"标准",difficulty:11,thresholds:[6,11],hp:4,stress:2,attack:{bonus:"+0",weapon:"镰刀",range:"近战",damage:"1d8+1 物理",line:"攻击：+0 | 镰刀：近战 | 1d8+1 物理"},experiences:"追踪者+2",description:"一名仙灵战士，身披树叶和树皮制成的盔甲。",motives:"伏击、隐藏、支付、保护、尾随",tierNote:"",features:[{name:"群体战术 Pack Tactics - 被动",desc:"如果木族战士进行一次成功的普通攻击，且另一个木族战士在目标的近战范围内，则造成 1d8+5 点物理伤害，而非其普通伤害，并且你获得 1 恐惧点。"},{name:"森林掌控 Forest Control - 动作",desc:"花费 1 恐惧点来拉倒近距离范围内的一棵树。被树击中的生物必须在敏捷反应掷骰（15）中成功，否则受到 1d10 点物理伤害。"},{name:"融入环境 Blend In - 反应",desc:"当木族战士成功攻击时，你可以标记 1 压力点使其处于 隐藏 状态，直到其下一次攻击，或一名玩家角色在本能掷骰（14）中成功找到他为止。"}],url:"https://daggerheart.huijiwiki.com/wiki/%E6%9C%A8%E6%97%8F%E6%88%98%E5%A3%AB"},{id:"%E8%8D%86%E8%94%93%E7%BA%A0%E7%BB%93%E7%BE%A4",name:"荆蔓纠结群",original:"TANGLE BRAMBLE SWARM",tier:1,type:"集群",difficulty:12,thresholds:[6,11],hp:6,stress:3,attack:{bonus:"+0",weapon:"荆棘",range:"近战",damage:"1d6+3 物理",line:"攻击：+0 | 荆棘：近战 | 1d6+3 物理"},experiences:"伪装+2",description:"一团活化的、吸血的风滚草，每株都有一个大葫芦那么大。",motives:"消化、擒缚、固定",tierNote:"（3/生命点）",features:[{name:"集群 Horde （1d4+2） - 被动",desc:"当荆蔓纠结群已标记一半或更多的生命点时，其普通攻击改为造成 1d4+2 点物理伤害。"},{name:"压碎 Crush - 动作",desc:"标记 1 压力点对拥有 3 个或更多荆棘指示物的一个目标造成 2d6+8 点直接物理伤害。"},{name:"束缚 Encumber - 反应",desc:"当集群攻击成功时，给予目标一个荆棘指示物。如果一个目标拥有任何荆棘指示物，则其处于 束缚 状态。如果一个目标拥有 3 个或更多荆棘指示物，则其也处于 脆弱 状态。所有荆棘标记可以通过在灵巧掷骰（12 + 荆棘标记数量）中成功，或对集群造成重度或更高伤害来移除。如果使用灵巧掷骰从一个目标身上移除荆棘指示物，则在其近战范围内生成等同于移除标记数量的荆蔓纠结体。"}],url:"https://daggerheart.huijiwiki.com/wiki/%E8%8D%86%E8%94%93%E7%BA%A0%E7%BB%93%E7%BE%A4"},{id:"%E8%8D%86%E8%94%93%E7%BA%A0%E7%BB%93%E4%BD%93",name:"荆蔓纠结体",original:"TANGLE BRAMBLE",tier:1,type:"杂兵",difficulty:11,thresholds:[null,null],hp:1,stress:1,attack:{bonus:"-1",weapon:"荆棘",range:"近战",damage:"2 物理",line:"攻击：-1 | 荆棘：近战 | 2 物理"},experiences:"",description:"一株活化的吸血风滚草。",motives:"合并、吸取、擒缚",tierNote:"",features:[{name:"杂兵 Minion （4） - 被动",desc:"当荆蔓纠结体受到任何伤害时，其即被击败。玩家角色每对荆蔓纠结体造成 4 点伤害，则在攻击能够成功命中的范围内额外击败一个杂兵。"},{name:"群体攻击 Group Attack - 动作",desc:"花费 1 恐惧点，选择一个目标，并聚焦目标近距离范围内的所有荆蔓纠结体。将这些荆蔓纠结体移动到目标的近战范围内，并进行一次共享攻击掷骰。成功时，每个荆蔓纠结体造成 2 点物理伤害。将这些伤害合并计算。"},{name:"吸血增殖 Drain and Multiply - 反应",desc:"当荆蔓纠结体的攻击导致一个目标标记生命点，且近距离范围内有三个或更多荆蔓纠结体时，你可以将这些杂兵合并成一个荆蔓纠结群。集群的生命点等于合并的杂兵数量。"}],url:"https://daggerheart.huijiwiki.com/wiki/%E8%8D%86%E8%94%93%E7%BA%A0%E7%BB%93%E4%BD%93"},{id:"%E6%AD%A6%E5%99%A8%E5%A4%A7%E5%B8%88",name:"武器大师",original:"WEAPONMASTER",tier:1,type:"斗士",difficulty:14,thresholds:[8,15],hp:6,stress:3,attack:{bonus:"+2",weapon:"双手大剑",range:"邻近",damage:"1d12+2 物理",line:"攻击：+2 | 双手大剑：邻近 | 1d12+2 物理"},experiences:"",description:"一位挥舞着比自身大两倍的剑的武器大师。",motives:"先发制人，瞄准最弱者，威吓",tierNote:"",features:[{name:"嘲讽打击 Goading Strike - 动作",desc:"对一个目标进行普通攻击。成功时，标记 1 压力点使目标直到下次成功攻击前处于 嘲讽 状态。处于 嘲讽 状态的目标攻击除武器大师以外的目标具有劣势。"},{name:"肾上腺素爆发 Adrenaline Burst - 动作",desc:"每场景一次，花费 1 恐惧点以恢复 2 生命点和清除 2 压力点。"},{name:"乘胜追击 Momentum - 反应",desc:"当武器大师成功命中玩家角色时，你获得 1 恐惧点。·"}],url:"https://daggerheart.huijiwiki.com/wiki/%E6%AD%A6%E5%99%A8%E5%A4%A7%E5%B8%88"},{id:"%E5%B9%BC%E5%B9%B4%E6%A0%91%E7%B2%BE",name:"幼年树精",original:"YOUNG DRYAD",tier:1,type:"头目",difficulty:11,thresholds:[6,11],hp:6,stress:2,attack:{bonus:"+0",weapon:"镰刀",range:"近战",damage:"1d8+5 物理",line:"攻击：+0 | 镰刀：近战 | 1d8+5 物理"},experiences:"领导力+3",description:"一位傲慢的树人，领导着森林的防御。",motives:"指挥、培育、修剪不受欢迎者",tierNote:"",features:[{name:"森林之声 Voice of the Forest - 动作",desc:"标记 1 压力点聚焦1d4个盟友，在不移动的情况下攻击同一个目标。成功时，它们的攻击造成一半伤害。"},{name:"荆棘牢笼 Thorny Cage - 动作",desc:"花费 1 恐惧点在邻近范围内的一个目标周围形成一个牢笼，并使其处于 束缚 状态，直到其通过成功的力量掷骰获得自由。当一个生物对牢笼进行动作掷骰时，其必须标记 1 压力点。"},{name:"乘胜追击 Momentum - 反应",desc:"当幼年树精成功命中玩家角色时，你获得 1 恐惧点。"}],url:"https://daggerheart.huijiwiki.com/wiki/%E5%B9%BC%E5%B9%B4%E6%A0%91%E7%B2%BE"},{id:"%E8%9B%AE%E5%8A%9B%E4%B8%A7%E5%B0%B8",name:"蛮力丧尸",original:"BRAWNY ZOMBIE",tier:1,type:"斗士",difficulty:10,thresholds:[8,15],hp:7,stress:4,attack:{bonus:"+2",weapon:"猛撞",range:"邻近",damage:"1d12+3 物理",line:"攻击：+2 | 猛撞：邻近 | 1d12+3 物理"},experiences:"附带伤害+2，投掷+4",description:"一具庞大的尸体，腐烂肿胀，充满怒意。",motives:"碾碎、摧毁、抛洒碎石、猛撞",tierNote:"",features:[{name:"迟缓 Slow - 被动",desc:"当你聚焦蛮力丧尸，且其数据块上没有指示物时，它无法立即行动。在它的数据块上放置一个标记，并描述它正在准备做什么。当你聚焦蛮力丧尸，且其数据块上有指示物时，移除指示物，它才可以行动。"},{name:"撕裂 Rend Asunder - 动作",desc:"对蛮力丧尸已处于 束缚 状态的一个目标进行一次具有优势的普通攻击。成功时，攻击造成直接伤害。"},{name:"撕扯 Rip and Tear - 反应",desc:"当蛮力丧尸进行一次成功的普通攻击时，你可以标记 1 压力点，暂时使目标处于 束缚 状态并迫使其标记 2 压力点。"}],url:"https://daggerheart.huijiwiki.com/wiki/%E8%9B%AE%E5%8A%9B%E4%B8%A7%E5%B0%B8"},{id:"%E6%8B%BC%E6%8E%A5%E5%B0%B8%E9%AD%94",name:"拼接尸魔",original:"PATCHWORK ZOMBIE HULK",tier:1,type:"独狼",difficulty:13,thresholds:[8,15],hp:10,stress:3,attack:{bonus:"+4",weapon:"多条手臂",range:"邻近",damage:"1d20 物理",line:"攻击：+4 | 多条手臂：邻近 | 1d20 物理"},experiences:"威吓+2，撕碎物体+2",description:"由无数尸体拼接而成的巨大集合体，如同一个整体般行动，四肢如躯干般粗大，拳头有成年半身人般大小。",motives:"吸收尸体、乱舞、饥饿、恐吓",tierNote:"",features:[{name:"易毁 Destructible - 被动",desc:"当拼接尸魔受到重度或更严重的伤害时，其额外标记 1 生命点。"},{name:"肢体乱舞 Flailing Limbs - 被动",desc:"当拼接尸魔进行普通攻击时，其可以攻击邻近范围内的所有目标。"},{name:"再添一员 Another for the Pile - 动作",desc:"当拼接尸魔在尸体的邻近范围内时，其可以将尸体融入自身，恢复 1 生命点和 清除 1 压力点。"},{name:"哀嚎尖啸 Tormented Screams - 动作",desc:"标记 1 压力点，使远距离范围内的所有玩家角色进行一次风度反应掷骰（13）。失败的目标失去 1 希望点，且每有一个失败的目标使你获得 1 恐惧点。成功的目标必须标记 1 压力点。"}],url:"https://daggerheart.huijiwiki.com/wiki/%E6%8B%BC%E6%8E%A5%E5%B0%B8%E9%AD%94"},{id:"%E8%85%90%E7%83%82%E4%B8%A7%E5%B0%B8",name:"腐烂丧尸",original:"ROTTED ZOMBIE",tier:1,type:"杂兵",difficulty:8,thresholds:[null,null],hp:1,stress:1,attack:{bonus:"−3",weapon:"啃咬",range:"近战",damage:"2 物理",line:"攻击：−3 | 啃咬：近战 | 2 物理"},experiences:"",description:"一具腐烂的尸体，蹒跚着逼近猎物。",motives:"啃食血肉、饥饿、撕咬、包围",tierNote:"",features:[{name:"杂兵 Minion （3） - 被动",desc:"当腐烂丧尸受到任何伤害时，其即被击败。玩家角色每对腐烂丧尸造成 3 点伤害，则在攻击能够成功命中的范围内额外击败一个杂兵。"},{name:"群体攻击 Group Attack - 动作",desc:"花费 1 恐惧点，选择一个目标，并聚焦目标近距离范围内的所有腐烂丧尸。将这些腐烂丧尸移动到目标的近战范围内，并进行一次共享攻击掷骰。成功时，每个腐烂丧尸造成 2 点伤害。将这些伤害合并计算。"}],url:"https://daggerheart.huijiwiki.com/wiki/%E8%85%90%E7%83%82%E4%B8%A7%E5%B0%B8"},{id:"%E8%B9%92%E8%B7%9A%E4%B8%A7%E5%B0%B8",name:"蹒跚丧尸",original:"SHAMBLING ZOMBIE",tier:1,type:"标准",difficulty:10,thresholds:[4,6],hp:4,stress:1,attack:{bonus:"+0",weapon:"啃咬",range:"近战",damage:"1d6+1 物理",line:"攻击：+0 | 啃咬：近战 | 1d6+1 物理"},experiences:"",description:"一具摇摇晃晃、只受饥饿驱使的活尸。",motives:"吞食、饥渴、围攻敌人、撕碎血肉",tierNote:"",features:[{name:"难以招架 Too Many to Handle - 被动",desc:"当蹒跚丧尸在某个生物的近战范围内，且至少有一只其他丧尸在该生物的近距离范围内时，所有以该生物为目标的攻击具有优势。"},{name:"骇人 Horrifying - 被动",desc:"目标因蹒跚丧尸的攻击而标记生命点时，也必须标记 1 压力点。"}],url:"https://daggerheart.huijiwiki.com/wiki/%E8%B9%92%E8%B7%9A%E4%B8%A7%E5%B0%B8"},{id:"%E5%BC%93%E7%AE%AD%E6%89%8B%E5%B0%8F%E9%98%9F",name:"弓箭手小队",original:"ARCHER SQUADRON",tier:2,type:"集群",difficulty:13,thresholds:[8,16],hp:4,stress:3,attack:{bonus:"+0",weapon:"长弓",range:"远距离",damage:"2d6+3 物理",line:"攻击：+0 | 长弓：远距离 | 2d6+3 物理"},experiences:"",description:"一群训练有素、手持巨弓的弓箭手。",motives:"紧密配合、生存、齐射",tierNote:"（2/生命点）",features:[{name:"集群 Horde （1d6+3） - 被动",desc:"当弓箭手小队已标记一半或更多的生命点时，其普通攻击改为造成1d6+3 物理伤害。"},{name:"集火齐射 Focused Volley - 动作",desc:"花费 1 恐惧点指定远距离范围内的一个点。对该点近距离范围内的所有目标进行一次具有优势的攻击。弓箭手小队成功命中的目标受到 1d10+4 物理伤害。"},{name:"压制火力 Suppressing Fire - 动作",desc:"标记 1 压力点指定远距离范围内的一个点。直到下一次恐惧结果的掷骰出现时，在该点近距离范围内移动的生物必须进行一次敏捷反应掷骰。失败时，其受到 2d6+3 物理伤害。成功时，其受到一半伤害。"}],url:"https://daggerheart.huijiwiki.com/wiki/%E5%BC%93%E7%AE%AD%E6%89%8B%E5%B0%8F%E9%98%9F"},{id:"%E5%88%BA%E5%AE%A2%E5%AD%A6%E5%BE%92",name:"刺客学徒",original:"APPRENTICE ASSASSIN",tier:2,type:"杂兵",difficulty:13,thresholds:[null,null],hp:1,stress:1,attack:{bonus:"-1",weapon:"飞刀",range:"邻近",damage:"4 物理",line:"攻击：-1 | 飞刀：邻近 | 4 物理"},experiences:"入侵+2",description:"渴望证明自己的年轻学徒。",motives:"鲁莽行事、杀戮、证明价值、炫耀",tierNote:"",features:[{name:"杂兵 Minion （6） - 被动",desc:"当刺客学徒受到任何伤害时，其即被击败。玩家角色每对刺客学徒造成 6 点伤害，则在攻击能够成功命中的范围内额外击败一个杂兵。"},{name:"群体攻击 Group Attack - 动作",desc:"花费 1 恐惧点，选择一个目标，并聚焦目标近距离范围内的所有刺客学徒。将这些刺客学徒移动到目标的近战范围内，并进行一次共享攻击掷骰。成功时，每个刺客学徒造成 4 点伤害。将这些伤害合并计算。"}],url:"https://daggerheart.huijiwiki.com/wiki/%E5%88%BA%E5%AE%A2%E5%AD%A6%E5%BE%92"},{id:"%E5%88%BA%E5%AE%A2%E6%AF%92%E5%B8%88",name:"刺客毒师",original:"ASSASSIN POISONER",tier:2,type:"潜伏",difficulty:14,thresholds:[8,16],hp:4,stress:4,attack:{bonus:"+3",weapon:"淬毒飞刀",range:"近距离",damage:"2d8+1 物理",line:"攻击：+3 | 淬毒飞刀：近距离 | 2d8+1 物理"},experiences:"侵入+2",description:"一个狡猾的恶棍，精通毒药和伏击。",motives:"预判、收取报酬、杀戮、污染食物和水源",tierNote:"",features:[{name:"碎牙毒素 Grindletooth Venom - 被动",desc:"被刺客毒师攻击而标记生命点的目标，直到恢复生命点前会持续处于 脆弱 状态。"},{name:"出其不意 Out of Nowhere - 被动",desc:"如果刺客毒师处于 隐藏 状态，其攻击具有优势。"},{name:"烟雾弥散 Fumigation - 动作",desc:"投掷一枚烟雾弹，使近距离范围内充满烟雾，该区域内所有目标处于 目眩 状态。处于 目眩 状态的目标在下一次动作掷骰时具有劣势，然后清除该状态。"}],url:"https://daggerheart.huijiwiki.com/wiki/%E5%88%BA%E5%AE%A2%E6%AF%92%E5%B8%88"},{id:"%E5%88%BA%E5%AE%A2%E5%A4%A7%E5%B8%88",name:"刺客大师",original:"MASTER ASSASSIN",tier:2,type:"头目",difficulty:15,thresholds:[12,25],hp:7,stress:5,attack:{bonus:"+5",weapon:"锯齿匕首",range:"近距离",damage:"2d10+2 物理",line:"攻击：+5 | 锯齿匕首：近距离 | 2d10+2 物理"},experiences:"指挥+3，入侵+3",description:"一名久经沙场的杀手，嗓音阴沉，刀刃致命。",motives:"伏击、生还、杀戮、为所有情况做准备",tierNote:"",features:[{name:"出其不意 Won't See It Coming - 被动",desc:"如果刺客大师处于 隐藏 状态，攻击造成直接伤害。"},{name:"协同打击 Strike as One - 动作",desc:"标记 1 压力点以聚焦数量等同于刺客大师未标记压力点的其他刺客。"},{name:"隐秘之刃 The Subtle Blade - 反应",desc:"当刺客大师成功对一个处于 脆弱 状态的目标进行普通攻击时，你可以花费 1 恐惧点来造成严重伤害，而不是其普通伤害。"},{name:"乘胜追击 Momentum - 反应",desc:"当刺客大师成功命中玩家角色时，你获得 1 恐惧点。"}],url:"https://daggerheart.huijiwiki.com/wiki/%E5%88%BA%E5%AE%A2%E5%A4%A7%E5%B8%88"},{id:"%E6%88%98%E6%96%97%E5%8C%A3",name:"战斗匣",original:"BATTLE BOX",tier:2,type:"独狼",difficulty:15,thresholds:[10,20],hp:8,stress:6,attack:{bonus:"+2",weapon:"猛击",range:"近战",damage:"2d6+3 物理",line:"攻击：+2 | 猛击：近战 | 2d6+3 物理"},experiences:"伪装+2",description:"一个立方体构造体，六个面上各有一个不同的符文。",motives:"改变战术、践踏敌人、伪装潜伏",tierNote:"",features:[{name:"无情 Relentless （2） - 被动",desc:"在每个游戏主持人轮次中，此敌人可以至多被聚焦 2 次。像往常一样花费恐惧点来聚焦。"},{name:"随机战术 Randomized Tactics - 动作",desc:"标记 1 压力点并掷一个 d6。 战斗匣使用对应的行动： 1. 魔力光束 Mana Beam 战斗匣射出一道灼热的光束。对远距离范围内的一个目标进行攻击。成功时，造成 2d10+2 魔法伤害。 2. 火焰喷射 Fire Jets 战斗匣飞向空中，旋转并释放火焰喷射流。对近距离范围内的所有目标进行攻击。战斗匣成功命中的目标受到 2d8 物理伤害。 3. 冲撞碾压 Trample。战斗匣在场地中不规则地高速穿梭。对近距离范围内的所有玩家角色进行攻击。战斗匣成功命中目标受到 1d6+5 物理伤害，并在其下一次掷出希望结果前处于 脆弱 状态。 4. 电击气体 Shocking Gas 战斗匣释放出一股带有闪电的银色气体。近距离范围内的所有目标必须进行一次成功的灵巧反应掷骰，否则标记 3 压力点。 5. 震荡拍击 Stunning Clap 战斗匣跃起，两侧猛烈碰撞，发出微型音爆。邻近范围内的所有目标必须进行一次成功的力量反应掷骰，否则在战斗匣被击败之前处于 脆弱 状态。 6. 灵能尖啸 Psionic Whine 战斗匣释放出一群机械蜂，其嗡鸣能够扰乱凡人的心智。近距离范围内的所有目标必须进行一次成功的风度反应掷骰，否则受到 2d4+9 直接魔法伤害。"},{name:"过载 Overcharge - 反应",desc:"在为战斗匣的攻击掷伤害骰之前，你可以标记 1 压力点以在伤害掷骰中添加一个 d6。此外，你获得 1 恐惧点。"},{name:"死亡爆裂 Death Quake - 反应",desc:"当战斗匣标记其最后一个生命点时，驱动它的魔法会因力量爆发而破裂。近距离范围内的所有目标必须进行一次成功的本能反应掷骰，否则受到 2d8+1 魔法伤害。"}],url:"https://daggerheart.huijiwiki.com/wiki/%E6%88%98%E6%96%97%E5%8C%A3"},{id:"%E6%B7%B7%E6%B2%8C%E9%A2%85%E9%AA%A8",name:"混沌颅骨",original:"CHAOS SKULL",tier:2,type:"远程",difficulty:15,thresholds:[8,16],hp:5,stress:4,attack:{bonus:"+2",weapon:"能量冲击",range:"近距离",damage:"2d8+3 魔法",line:"攻击：+2 | 能量冲击：近距离 | 2d8+3 魔法"},experiences:"",description:"一一颗漂浮的类人生物头骨，由闪烁的魔力驱动着行动。",motives:"怪笑、吞噬魔法、为创造者服务",tierNote:"",features:[{name:"悬浮 Levitation - 被动",desc:"混沌颅骨悬浮在地面数尺之上，无法处于 束缚 状态。"},{name:"防护结界 Wards - 被动",desc:"混沌颅骨对魔法伤害具有抗性。"},{name:"魔法爆发 Magic Burst - 动作",desc:"标记 1 压力点，对近距离范围内的所有目标进行攻击。混沌颅骨成功攻击的目标受到 2d6+4 点魔法伤害。"},{name:"虹吸魔法 Siphon Magic - 动作",desc:"花费 1 恐惧点，对一名邻近范围内具有施法属性的玩家角色进行攻击。成功时，目标标记 1d4 压力点，混沌颅骨清除同等数量的压力点。此外，成功时，混沌颅骨可以立即再次获得聚焦。"}],url:"https://daggerheart.huijiwiki.com/wiki/%E6%B7%B7%E6%B2%8C%E9%A2%85%E9%AA%A8"},{id:"%E5%BA%94%E5%BE%81%E5%85%B5",name:"应征兵",original:"CONSCRIPT",tier:2,type:"杂兵",difficulty:12,thresholds:[null,null],hp:1,stress:1,attack:{bonus:"+0",weapon:"长矛",range:"邻近",damage:"6 物理",line:"攻击：+0 | 长矛：邻近 | 6 物理"},experiences:"",description:"一名训练不足、被强征入伍的平民。",motives:"服从命令，围攻，生存",tierNote:"",features:[{name:"杂兵 Minion （6） - 被动",desc:"当应征兵受到任何伤害时，其即被击败。玩家角色每对应征兵造成 6 点伤害，则在攻击能够成功命中的范围内额外击败一个杂兵。"},{name:"群体攻击 Group Attack - 动作",desc:"花费 1 恐惧点，选择一个目标，并聚焦目标近距离范围内的所有应征兵。将这些应征兵移动到目标的近战范围内，并进行一次共享攻击掷骰。成功时，每个应征兵造成 4 点伤害。将这些伤害合并计算。"}],url:"https://daggerheart.huijiwiki.com/wiki/%E5%BA%94%E5%BE%81%E5%85%B5"},{id:"%E4%BA%A4%E9%99%85%E8%8A%B1",name:"交际花",original:"COURTESAN",tier:2,type:"社交",difficulty:13,thresholds:[7,13],hp:3,stress:4,attack:{bonus:"-3",weapon:"匕首",range:"近战",damage:"1d4+3 物理",line:"攻击：-3 | 匕首：近战 | 1d4+3 物理"},experiences:"操纵+3，社交名流+3",description:"一位技艺娴熟的操纵者和社交艺术大师。",motives:"诱惑，周旋，拉拢赞助人",tierNote:"",features:[{name:"灼热凝视 Searing Glance - 反应",desc:"当一个近距离范围内的玩家角色进行风度掷骰时，你可以标记 1 压力点投去一瞥以审视其结果。如果目标失败，其必须标记 2 压力点并处于 脆弱 状态，直到场景结束或其在对抗交际花的社交动作中成功。如果目标成功，其必须标记 1 压力点。"}],url:"https://daggerheart.huijiwiki.com/wiki/%E4%BA%A4%E9%99%85%E8%8A%B1"},{id:"%E9%82%AA%E6%95%99%E7%88%AA%E7%89%99",name:"邪教爪牙",original:"CULT FANG",tier:2,type:"潜伏",difficulty:15,thresholds:[9,17],hp:4,stress:4,attack:{bonus:"+2",weapon:"长刀",range:"近战",damage:"2d8+4 物理",line:"攻击：+2 | 长刀：近战 | 2d8+4 物理"},experiences:"",description:"一名转变为邪教徒的职业杀手。",motives:"俘获祭品，孤立猎物，向上爬升",tierNote:"",features:[{name:"暗影之拥 Shadow's Embrace - 被动",desc:"邪教爪牙可以在垂直表面攀爬和行走。标记 1 压力点以从远距离范围内的一处阴影移动到另一处阴影。"},{name:"孤立无援 Pick Off the Straggler - 动作",desc:"标记 1 压力点令近战范围内的一个目标进行一次本能反应掷骰。失败时，目标必须标记 2 压力点，并与邪教爪牙一起传送到远距离范围内的一处阴影中，使其暂时处于 脆弱 状态。成功时，目标必须标记 1 压力点。"}],url:"https://daggerheart.huijiwiki.com/wiki/%E9%82%AA%E6%95%99%E7%88%AA%E7%89%99"},{id:"%E9%82%AA%E6%95%99%E5%AD%A6%E5%BE%92",name:"邪教学徒",original:"CULT INITIATE",tier:2,type:"杂兵",difficulty:13,thresholds:[null,null],hp:1,stress:1,attack:{bonus:"+0",weapon:"仪式匕首",range:"近战",damage:"5 物理",line:"攻击：+0 | 仪式匕首：近战 | 5 物理"},experiences:"",description:"身着简朴长袍的低阶邪教徒，渴望获得力量。",motives:"服从命令，获取力量，追求禁忌知识",tierNote:"",features:[{name:"杂兵 Minion （6） - 被动",desc:"当邪教学徒受到任何伤害时，其即被击败。玩家角色每对邪教学徒造成 6 点伤害，则在攻击能够成功命中的范围内额外击败一个杂兵。"},{name:"群体攻击 Group Attack - 动作",desc:"花费 1 恐惧点，选择一个目标，并聚焦目标近距离范围内的所有邪教学徒。将这些邪教学徒移动到目标的近战范围内，并进行一次共享攻击掷骰。成功时，每个邪教学徒造成 5 点伤害。将这些伤害合并计算。"}],url:"https://daggerheart.huijiwiki.com/wiki/%E9%82%AA%E6%95%99%E5%AD%A6%E5%BE%92"},{id:"%E6%81%B6%E9%AD%94%E7%8C%8E%E7%8A%AC%E7%BE%A4",name:"恶魔猎犬群",original:"DEMONIC HOUND PACK",tier:2,type:"集群",difficulty:15,thresholds:[11,23],hp:6,stress:3,attack:{bonus:"+0",weapon:"爪牙",range:"近战",damage:"2d8+2 物理",line:"攻击：+0 | 爪牙：近战 | 2d8+2 物理"},experiences:"气味追踪+3",description:"体内燃着地狱之火的怪异猎犬。",motives:"制造恐惧，吞噬血肉，取悦主人",tierNote:"",features:[{name:"集群 Horde （2d4+1） - 被动",desc:"当恶魔猎犬群已标记一半或更多的生命点时，其普通攻击改为造成 2d4+1 点物理伤害。"},{name:"恐惧嚎叫 Dreadhowl - 动作",desc:"标记 1 压力点，使邻近范围内的所有目标失去 1 希望点。如果目标无法失去希望点，则改为标记 2 压力点。"},{name:"乘胜追击 Momentum - 反应",desc:"：当恶魔猎犬群成功命中玩家角色时，你获得 1 恐惧点。"}],url:"https://daggerheart.huijiwiki.com/wiki/%E6%81%B6%E9%AD%94%E7%8C%8E%E7%8A%AC%E7%BE%A4"},{id:"%E7%94%B5%E9%B3%97%E7%BE%A4",name:"电鳗群",original:"ELECTRIC EELS",tier:2,type:"集群",difficulty:14,thresholds:[10,20],hp:5,stress:3,attack:{bonus:"+0",weapon:"电击撕咬",range:"近战",damage:"2d6+4 物理",line:"攻击：+0 | 电击撕咬：近战 | 2d6+4 物理"},experiences:"",description:"一群围攻目标并释放电击的鳗鱼。",motives:"躲避大型掠食者、电击猎物、撕裂",tierNote:"",features:[{name:"集群 Horde （2d4+1） - 被动",desc:"当电鳗群已标记一半或更多的生命点时，其普通攻击改为造成 2d4+1 点物理伤害。"},{name:"麻痹电击 Paralyzing Shock - 动作",desc:"标记 1 压力点，对邻近范围内的所有目标进行一次普通攻击。每有一个标记生命点的目标，你获得 1 恐惧点。"}],url:"https://daggerheart.huijiwiki.com/wiki/%E7%94%B5%E9%B3%97%E7%BE%A4"},{id:"%E7%B2%BE%E9%94%90%E5%A3%AB%E5%85%B5",name:"精锐士兵",original:"ELITE SOLDIER",tier:2,type:"标准",difficulty:15,thresholds:[9,18],hp:4,stress:3,attack:{bonus:"+1",weapon:"长矛",range:"邻近",damage:"2d8+4 物理",line:"攻击：+1 | 长矛：邻近 | 2d8+4 物理"},experiences:"",description:"一位身披护甲的侍从或有战斗经验的平民，渴望晋升。",motives:"赢得荣耀，维持秩序，结交盟友",tierNote:"",features:[{name:"增援 Reinforce - 动作",desc:"标记 1 压力点，移动至一名盟友的近战范围内，并对一个邻近范围内的目标进行一次普通攻击。若成功，造成 2d10+2 点物理伤害，且该盟友可以清除 1 压力点。"},{name:"附庸忠诚 Vassal's Loyalty - 反应",desc:"当精锐士兵处于一名将要受到伤害的骑士或其他贵族的邻近范围内，你可以标记 1 压力点，移动其至目标近战范围内，并代替承受伤害。"}],url:"https://daggerheart.huijiwiki.com/wiki/%E7%B2%BE%E9%94%90%E5%A3%AB%E5%85%B5"},{id:"%E5%A4%B1%E8%B4%A5%E5%AE%9E%E9%AA%8C%E4%BD%93",name:"失败实验体",original:"FAILED EXPERIMENT",tier:2,type:"标准",difficulty:13,thresholds:[12,23],hp:3,stress:3,attack:{bonus:"+1",weapon:"撕咬和爪击",range:"近战",damage:"2d6+5 物理",line:"攻击：+1 | 撕咬和爪击：近战 | 2d6+5 物理"},experiences:"模仿者+3",description:"一次失败的死灵魔法实验，造就了这具扭曲怪异的畸形体。",motives:"吞食，狩猎，追踪",tierNote:"",features:[{name:"扭曲韧性 Warped Fortitude - 被动",desc:"失败实验体对物理伤害具有抗性。"},{name:"镇压 Overwhelm - 被动",desc:"当失败实验体攻击的目标的邻近范围内有其他敌对生物时，失败实验体造成双倍伤害。"},{name:"踉跄突进 Lurching Lunge - 动作",desc:"标记 1 压力点以聚焦失败实验体作为额外游戏主持人行动，而非花费恐惧点。"}],url:"https://daggerheart.huijiwiki.com/wiki/%E5%A4%B1%E8%B4%A5%E5%AE%9E%E9%AA%8C%E4%BD%93"},{id:"%E5%B7%A8%E4%BA%BA%E9%A9%AF%E5%85%BD%E5%B8%88",name:"巨人驯兽师",original:"GIANT BEASTMASTER",tier:2,type:"头目",difficulty:16,thresholds:[12,24],hp:6,stress:5,attack:{bonus:"+2",weapon:"长弓",range:"远距离",damage:"2d8+4 物理",line:"攻击：+2 | 长弓：远距离 | 2d8+4 物理"},experiences:"驯兽+3",description:"身披皮革，手持长鞭和巨弓的战士。",motives:"指挥，谋生，机动，压制目标，保护同伴动物",tierNote:"",features:[{name:"一心同体 Two as One - 被动",desc:"当巨人驯兽师被聚焦时，你可以同时聚焦一个目前在其控制下的位阶1动物敌人。"},{name:"定身打击 Pinning Strike - 动作",desc:"对一个目标进行一次普通攻击。成功时，你可以标记 1 压力点将其压制在附近的平面上。被压制的目标处于 束缚 状态，直到其成功通过一次灵巧或力量掷骰以挣脱。"},{name:"致命同伴 Deadly Companion - 动作",desc:"每场景两次，召唤一只熊、恐狼或类似的位阶1动物敌人，处于驯兽师的控制下。该敌人出现在其近距离范围，并立即进行聚焦。"}],url:"https://daggerheart.huijiwiki.com/wiki/%E5%B7%A8%E4%BA%BA%E9%A9%AF%E5%85%BD%E5%B8%88"},{id:"%E5%B7%A8%E4%BA%BA%E6%96%97%E5%A3%AB",name:"巨人斗士",original:"GIANT BRAWLER",tier:2,type:"斗士",difficulty:15,thresholds:[14,28],hp:7,stress:4,attack:{bonus:"+2",weapon:"战锤",range:"邻近",damage:"2d12+3 物理",line:"攻击：+2 | 战锤：邻近 | 2d12+3 物理"},experiences:"侵入+2",description:"一名异常强壮的巨人，挥舞着比人类还大的战锤。",motives:"谋生，制服，猛撞，击倒",tierNote:"",features:[{name:"破阵冲撞 Battering Ram - 动作",desc:"标记 1 压力点，使巨人斗士冲向近距离范围内某个可以合理摧毁的无生命物体（如墙壁、推车或市场摊位），并摧毁它。该物体邻近范围内的所有目标必须成功通过一次敏捷反应掷骰，否则会受到来自物体的残骸碎片造成的2d4+3点物理伤害。"},{name:"血腥报复 Bloody Reprisal - 反应",desc:"当巨人斗士被邻近范围内的一次攻击中标记 2 或更多的生命点时，你可以对攻击者进行一次普通攻击。成功时，巨人斗士造成的物理伤害为2d6+15，而不是其普通伤害。"},{name:"乘胜追击 Momentum - 反应",desc:"当巨人斗士成功命中玩家角色时，你获得 1 恐惧点。"}],url:"https://daggerheart.huijiwiki.com/wiki/%E5%B7%A8%E4%BA%BA%E6%96%97%E5%A3%AB"},{id:"%E5%B7%A8%E4%BA%BA%E6%96%B0%E5%85%B5",name:"巨人新兵",original:"GIANT RECRUIT",tier:2,type:"杂兵",difficulty:13,thresholds:[null,null],hp:1,stress:2,attack:{bonus:"+1",weapon:"战锤",range:"邻近",damage:"5 物理",line:"攻击：+1 | 战锤：邻近 | 5 物理"},experiences:"",description:"一个穿着借来的盔甲的巨人战士。",motives:"殴打，谋生，制服，恐吓",tierNote:"",features:[{name:"杂兵 Minion （7） - 被动",desc:"当巨人新兵受到任何伤害时，其即被击败。玩家角色每对巨人新兵造成 7 点伤害，则在攻击能够成功命中的范围内额外击败一个杂兵。"},{name:"群体攻击 Group Attack - 动作",desc:"花费 1 恐惧点，选择一个目标，并聚焦目标近距离范围内的所有巨人新兵。将这些小巨人新兵移动到目标的近战范围内，并进行一次共享攻击掷骰。成功时，每个巨人新兵造成 5 点伤害。将这些伤害合并计算。"}],url:"https://daggerheart.huijiwiki.com/wiki/%E5%B7%A8%E4%BA%BA%E6%96%B0%E5%85%B5"},{id:"%E5%B7%A8%E9%B9%B0",name:"巨鹰",original:"GIANT EAGLE",tier:2,type:"潜伏",difficulty:14,thresholds:[8,19],hp:4,stress:4,attack:{bonus:"+1",weapon:"爪与喙",range:"邻近",damage:"2d6+3 物理",line:"攻击：+1 | 爪与喙：邻近 | 2d6+3 物理"},experiences:"",description:"一只利爪染血的巨型猛禽。",motives:"捕食猎物，保持机动，果断出击",tierNote:"",features:[{name:"飞行 Flight - 被动",desc:"飞行时，巨鹰的难度获得 +3 加值。"},{name:"致命俯冲 Deadly Dive - 动作",desc:"标记 1 压力点，攻击一个远距离范围内的目标。成功时，造成 2d10+2 物理伤害，并将目标击倒，使其在下次行动之前处于 脆弱 状态。"},{name:"起飞 Take Off - 动作",desc:"对一个邻近范围内的目标进行一次攻击。成功时，造成 2d4+3 物理伤害，目标必须进行一次成功的敏捷反应掷骰，否则暂时被巨鹰巨大的爪子抓住处于 束缚 状态。如果目标处于 束缚 状态，巨鹰会立即带着目标升空，到达战场上方的极远范围。"},{name:"致命投掷 Deadly Drop - 动作",desc:"飞行时，巨鹰可以投下被其抓住的处于 束缚 状态的目标。被投下时，目标不再处于 束缚 状态，但开始下落。如果在玩家角色的下一次行动中未能阻止其下落，目标落地时受到 2d20 物理伤害。"}],url:"https://daggerheart.huijiwiki.com/wiki/%E5%B7%A8%E9%B9%B0"},{id:"%E6%88%88%E5%B0%94%E8%B4%A1",name:"戈尔贡",original:"GORGON",tier:2,type:"独狼",difficulty:15,thresholds:[13,25],hp:9,stress:3,attack:{bonus:"+4",weapon:"烈日短弓",range:"远距离",damage:"2d20+3 魔法",line:"攻击：+4 | 烈日短弓：远距离 | 2d20+3 魔法"},experiences:"隐匿+3",description:"一名蛇首鳞身的类人生物，手持镀金长弓，对其安宁被打扰而愤怒不已。",motives:"逼入死角，游击，石化，追求复仇",tierNote:"",features:[{name:"无情 Relentless （2） - 被动",desc:"在每个游戏主持人轮次中，此敌人可以至多被聚焦 2 次。像往常一样花费恐惧点来聚焦。"},{name:"烈日箭 Sunsear Arrows - 被动",desc:"当戈耳贡进行一次成功的普通攻击时，目标处于 发光 状态直到场景结束，且无法处于 隐藏 状态。对处于 发光 状态的目标进行攻击掷骰具有优势。"},{name:"蛇之王冠 Crown of Serpents - 动作",desc:"使用戈耳贡的护体毒蛇对一个近战范围内的目标进行一次攻击掷骰。成功时，标记 1 压力点，造成 2d10+4 物理伤害，并且目标必须标记 1 压力点。"},{name:"石化凝视 Petrifying Gaze - 反应",desc:"当戈耳贡因近距离范围内的攻击而受到伤害时，你可以花费 1 恐惧点，迫使攻击者进行一次本能反应掷骰。失败时，其开始石化，标记 1 生命点并开始一个石化倒计时 （4）。这个倒计时在戈耳贡受到攻击时推进。当倒计时触发时，目标必须进行一次死亡行动。如果戈耳贡被击败，所有石化倒计时中止。"},{name:"乘胜追击 Momentum - 反应",desc:"当戈尔贡成功命中玩家角色时，你获得 1 恐惧点。"}],url:"https://daggerheart.huijiwiki.com/wiki/%E6%88%88%E5%B0%94%E8%B4%A1"},{id:"%E7%8E%8B%E5%9B%BD%E9%AA%91%E5%A3%AB",name:"王国骑士",original:"KNIGHT OF THE REALM",tier:2,type:"头目",difficulty:15,thresholds:[13,26],hp:6,stress:4,attack:{bonus:"+4",weapon:"长剑",range:"近战",damage:"2d10+4 物理",line:"攻击：+4 | 长剑：近战 | 2d10+4 物理"},experiences:"古代知识+3，上流社会+2，战术+2",description:"一位身披重甲、骑乘强大战马的功勋卓著的士兵。",motives:"冲锋践踏、追求荣耀、展现威严",tierNote:"",features:[{name:"骑士之姿 Chevalier - 被动",desc:"当王国骑士骑乘坐骑时，其难度获得 +2 加值。当其受到严重伤害时，会从坐骑上摔落，并失去此加值，直至下次被聚焦。"},{name:"重甲护身 Heavily Armored - 被动",desc:"当王国骑士受到物理伤害时，减少 3 点伤害。"},{name:"骑兵冲锋 Cavalry Charge - 动作",desc:"若王国骑士正在骑乘坐骑，你可以在远距离范围内移动，并对一个目标进行一次普通攻击。成功时，造成 2d8+4 物理伤害，且目标必须标记 1 压力点。"},{name:"为了王国！ For the Realm！ - 动作",desc:"标记 1 压力点，聚焦 1d4+1 个盟友。其在以这种方式被聚焦时进行的攻击造成一半伤害。"}],url:"https://daggerheart.huijiwiki.com/wiki/%E7%8E%8B%E5%9B%BD%E9%AA%91%E5%A3%AB"},{id:"%E8%92%99%E9%9D%A2%E7%9B%97%E8%B4%BC",name:"蒙面盗贼",original:"MASKED THIEF",tier:2,type:"潜伏",difficulty:14,thresholds:[8,17],hp:4,stress:5,attack:{bonus:"+3",weapon:"单刃剑",range:"近战",damage:"2d8+3 物理",line:"攻击：+3 | 单刃剑：近战 | 2d8+3 物理"},experiences:"特技+3",description:"一个狡猾的盗贼，身手敏捷，擅长戏剧性的表演。",motives:"躲避、隐藏、窃取、获利",tierNote:"",features:[{name:"快手 Quick Hands - 动作",desc:"对一个近战范围内的目标进行一次攻击。成功时，造成 1d8+2 物理伤害，且蒙面盗贼从目标的物品栏中偷取一件物品或消耗品。"},{name:"逃脱计划 Escape Plan - 动作",desc:"标记 1 压力点，揭示蒙面盗贼在战场任意位置设置的一个陷阱。陷阱邻近范围内的所有目标必须进行一次成功的敏捷反应掷骰（13），否则会被拽离地面并倒挂起来。目标会处于 束缚 和 脆弱 状态，直到其进行一次成功的灵巧或力量掷骰（13）以挣脱，结束两种状态。"}],url:"https://daggerheart.huijiwiki.com/wiki/%E8%92%99%E9%9D%A2%E7%9B%97%E8%B4%BC"},{id:"%E5%95%86%E4%B8%9A%E5%A4%A7%E4%BA%A8",name:"商业大亨",original:"MERCHANT BARON",tier:2,type:"社交",difficulty:15,thresholds:[9,19],hp:5,stress:3,attack:{bonus:"−2",weapon:"刺剑",range:"近战",damage:"1d6+2 物理",line:"攻击：−2 | 刺剑：近战 | 1d6+2 物理"},experiences:"贵族+2，贸易+2",description:"一位成功的商人，麾下拥有庞大的产业。",motives:"滥用权力、收集资源、调动杂兵",tierNote:"",features:[{name:"人皆有价 Everyone Has a Price - 动作",desc:"花费 1 恐惧点，向一个目标提出一个伴随风险的交易，承诺给予其渴望或所需之物。如果对玩家角色使用，其必须进行一次风度反应掷骰（17）。失败时，其必须标记 2 压力点或接受交易。"},{name:"雇佣最好的打手 The Best Muscle Money Can Buy - 动作",desc:"每场景一次，标记 1 压力点，召唤 1d4+1 个位阶 1 敌人出现在远距离范围处，以执行商业大亨的意志。"}],url:"https://daggerheart.huijiwiki.com/wiki/%E5%95%86%E4%B8%9A%E5%A4%A7%E4%BA%A8"},{id:"%E5%91%BD%E5%AE%9A%E7%8C%8E%E6%89%8B",name:"命定猎手",original:"MORTAL HUNTER",tier:2,type:"头目",difficulty:16,thresholds:[15,27],hp:6,stress:4,attack:{bonus:"+5",weapon:"撕裂血肉",range:"邻近",damage:"2d12+1 物理",line:"攻击：+5 | 撕裂血肉：邻近 | 2d12+1 物理"},experiences:"寻血+3",description:"一个身穿厚重皮衣的亡灵，眼神锐利，举止随意而残忍。",motives:"吞食、狩猎、追踪",tierNote:"",features:[{name:"惊怖 Terrifying - 被动",desc:"当命定猎手成功攻击时，所有远距离范围内的玩家角色失去 1 希望点，而你获得 1 恐惧点。"},{name:"死亡锁定 Deathlock - 动作",desc:"花费 1 恐惧点诅咒一个邻近范围内的目标，使其处于 死亡锁定 状态，直到场景结束。命定猎手对处于死亡锁定状态的目标进行的攻击将造成直接伤害。命定猎手一次只能维持一个 死亡锁定。"},{name:"命定之死 Inevitable Death - 动作",desc:"标记 1 压力点以聚焦1d4个盟友。其在以这种方式被聚焦时进行的攻击造成一半伤害。"},{name:"践踏 Rampage - 反应",desc:"倒计时 （循环 1d6）。当猎手第一次被聚焦时，激活倒计时。当倒计时触发时，将命定猎手沿直线移动到远距离范围内的某个点，并对路径上的所有目标进行攻击。猎手成功命中的目标受到2d8+2点物理伤害。"}],url:"https://daggerheart.huijiwiki.com/wiki/%E5%91%BD%E5%AE%9A%E7%8C%8E%E6%89%8B"},{id:"%E7%9A%87%E5%AE%B6%E9%A1%BE%E9%97%AE",name:"皇家顾问",original:"ROYAL ADVISOR",tier:2,type:"社交",difficulty:14,thresholds:[8,15],hp:3,stress:3,attack:{bonus:"−3",weapon:"魔杖",range:"远距离",damage:"1d4+3 物理",line:"攻击：−3 | 魔杖：远距离 | 1d4+3 物理"},experiences:"行政+3,朝臣+3",description:"一位能接触到当地贵族的高阶朝臣。",motives:"祈求恩宠，伪造证据，筹谋",tierNote:"",features:[{name:"毁灭性反驳 Devastating Retort - 被动",desc:"对皇家顾问进行动作掷骰时，掷骰结果小于17的玩家角色必须标记 1 压力点。"},{name:"倾耳密语 Bend Ears - 动作",desc:"标记 1 压力点，用低语影响近战范围内的一名非玩家角色。该目标在某件事上的看法会倾向于皇家顾问的偏好，除非这与目标的动机直接冲突。"},{name:"替罪羊 Scapegoat - 动作",desc:"花费 1 恐惧点对一群人或某个显赫人物进行游说，让其相信某个个人或团体应对目标面临的某个问题负责。目标将对替罪羊抱有敌意，直到进行一次成功的风度掷骰（17）确信其无辜。"}],url:"https://daggerheart.huijiwiki.com/wiki/%E7%9A%87%E5%AE%B6%E9%A1%BE%E9%97%AE"},{id:"%E5%AE%88%E5%AF%86%E4%BA%BA",name:"守密人",original:"SECRET-KEEPER",tier:2,type:"头目",difficulty:16,thresholds:[13,26],hp:7,stress:4,attack:{bonus:"+3",weapon:"符文法杖",range:"远距离",damage:"2d12 魔法",line:"攻击：+3 | 符文法杖：远距离 | 2d12 魔法"},experiences:"胁迫+2,堕落学识+2",description:"与堕落之神有直接联系的秘密头目。",motives:"积聚强大力量，密谋，发号施令",tierNote:"",features:[{name:"机不可失 Seize Your Moment - 动作",desc:"花费 2 恐惧点，使1d4个盟友获得聚焦。其在以这种方式被聚焦时进行的攻击造成一半伤害。"},{name:"吾主旨意 Our Master's Will - 反应",desc:"当你使一个远距离范围内的盟友获得聚焦时，标记 1 压力点以获得 1 恐惧点。"},{name:"召唤仪式 Summoning Ritual - 反应",desc:"倒计时 （6）。当首次聚焦守密人时，激活此倒计时。当其标记生命点时，推进倒计时，推进数等同于标记的生命点数量。当倒计时触发时，召唤一个小型恶魔，使其出现在近距离范围处。"},{name:"堕落猎犬 Fallen Hounds - 反应",desc:"每场景一次，当守密人标记 2 或更多的生命点时，你可以标记 1 压力点以召唤一个恶魔猎犬群，其出现在近距离范围内并立即获得聚焦。"}],url:"https://daggerheart.huijiwiki.com/wiki/%E5%AE%88%E5%AF%86%E4%BA%BA"},{id:"%E9%B2%A8%E9%B1%BC",name:"鲨鱼",original:"SHARK",tier:2,type:"斗士",difficulty:14,thresholds:[14,28],hp:7,stress:3,attack:{bonus:"+2",weapon:"利齿巨口",range:"邻近",damage:"2d12+1 物理",line:"攻击：+2 | 利齿巨口：邻近 | 2d12+1 物理"},experiences:"嗅觉+3",description:"一种大型水生捕食者，总是在移动。",motives:"寻找鲜血，隔离猎物，攻击弱者",tierNote:"",features:[{name:"惊怖 Terrifying - 被动",desc:"当鲨鱼成功攻击时，所有远距离范围内的玩家角色失去 1 希望点，而你获得 1 恐惧点。"},{name:"撕裂之咬 Rending Bite - 被动",desc:"当鲨鱼成功攻击时，目标必须标记 1 护甲槽，且不获得其效果（其仍然可以使用护甲来减少伤害）。如果其无法标记护甲槽，必须额外标记 1 生命点。"},{name:"嗜血本能 Blood in the Water - 反应",desc:"当鲨鱼近距离范围内的一个生物因另一生物的攻击而标记生命点时，你可以标记 1 压力点以立即聚焦鲨鱼，将其移动到目标的近战范围并进行一次普通攻击。"}],url:"https://daggerheart.huijiwiki.com/wiki/%E9%B2%A8%E9%B1%BC"},{id:"%E5%A1%9E%E5%A3%AC%E6%B5%B7%E5%A6%96",name:"塞壬海妖",original:"SIREN",tier:2,type:"潜伏",difficulty:14,thresholds:[9,18],hp:5,stress:3,attack:{bonus:"+2",weapon:"扩张颚咬",range:"近战",damage:"2d6+3 物理",line:"攻击：+2 | 扩张颚咬：近战 | 2d6+3 物理"},experiences:"歌唱曲目+3",description:"一名半鱼人，拥有闪光的鳞片与难以抗拒的嗓音。",motives:"吞噬，引诱猎物，用歌声制服",tierNote:"",features:[{name:"俘获人心 Captive Audience - 被动",desc:"如果塞壬海妖对一个因其歌声而处于 迷醉 状态的目标进行普通攻击，攻击造成 2d10+1 点伤害，而不是普通伤害。"},{name:"魅惑之歌 Enchanting Song - 动作",desc:"花费 1 恐惧点唱出一首影响近距离范围内的所有目标的歌曲。目标必须进行一次成功的本能反应掷骰，否则会处于 迷醉 状态，直到其标记 2 压力点。目标近距离范围内的任一塞壬海妖可以标记 1 压力点，使该反应掷骰的难度增加+1。在目标处于 迷醉 状态期间，目标无法行动且处于 脆弱 状态。"}],url:"https://daggerheart.huijiwiki.com/wiki/%E5%A1%9E%E5%A3%AC%E6%B5%B7%E5%A6%96"},{id:"%E5%B9%BD%E7%81%B5%E5%BC%93%E7%AE%AD%E6%89%8B",name:"幽灵弓箭手",original:"SPECTRAL ARCHER",tier:2,type:"远程",difficulty:13,thresholds:[6,14],hp:3,stress:3,attack:{bonus:"+3",weapon:"长弓",range:"远距离",damage:"2d10+2 物理",line:"攻击：+3 | 长弓：远距离 | 2d10+2 物理"},experiences:"古代知识+2",description:"一名手持灵弓的幽灵战士，在其守护之人仍受威胁时无法安息。",motives:"穿过实体，远离混战，重演旧日战役",tierNote:"",features:[{name:"幽灵 Ghost - 被动",desc:"幽灵弓箭手对物理伤害具有抗性。标记 1 压力点以穿过某个实体移动至近距离范围。"},{name:"挑选目标 Pick Your Target - 动作",desc:"花费 1 恐惧点对一名远距离范围内的、且位于至少两名其他玩家角色邻近范围内的玩家角色进行攻击。成功时，目标受到 2d8+12 点物理伤害。"}],url:"https://daggerheart.huijiwiki.com/wiki/%E5%B9%BD%E7%81%B5%E5%BC%93%E7%AE%AD%E6%89%8B"},{id:"%E5%B9%BD%E7%81%B5%E9%98%9F%E9%95%BF",name:"幽灵队长",original:"SPECTRAL CAPTAIN",tier:2,type:"头目",difficulty:16,thresholds:[13,26],hp:6,stress:4,attack:{bonus:"+3",weapon:"长弓",range:"远距离",damage:"2d10+3 物理",line:"攻击：+3 | 长弓：远距离 | 2d10+3 物理"},experiences:"古代知识+3",description:"一位率领亡灵军队的幽灵指挥官。",motives:"穿过实体，集结部队，重演旧日战役",tierNote:"",features:[{name:"幽灵 Ghost - 被动",desc:"幽灵队长对物理伤害具有抗性。标记 1 压力点以穿过某个实体在近距离范围内移动。"},{name:"无尽之战 Unending Battle - 动作",desc:"花费 2 恐惧点将至多 1d4+1 个已被击败的幽灵盟友以未标记生命点或压力点的状态返回至其首次出现的战场位置。"},{name:"坚守阵地 Hold Fast - 反应",desc:"当幽灵队长的幽灵盟友被迫进行反应掷骰时，你可以标记 1 压力点以给予这些盟友掷骰结果+2的加值。"},{name:"乘胜追击 Momentum - 反应",desc:"当幽灵队长成功命中玩家角色时，你获得 1 恐惧点。"}],url:"https://daggerheart.huijiwiki.com/wiki/%E5%B9%BD%E7%81%B5%E9%98%9F%E9%95%BF"},{id:"%E5%B9%BD%E7%81%B5%E5%AE%88%E6%8A%A4%E8%80%85",name:"幽灵守护者",original:"SPECTRAL GUARDIAN",tier:2,type:"标准",difficulty:15,thresholds:[7,15],hp:4,stress:3,attack:{bonus:"+1",weapon:"长矛",range:"邻近",damage:"2d8+1 物理",line:"攻击：+1 | 长矛：邻近 | 2d8+1 物理"},experiences:"古代知识+2",description:"一位手持长矛和利剑，被职责束缚的幽灵战士。",motives:"穿过实体，保护宝藏，重温旧日战役",tierNote:"",features:[{name:"幽灵 Ghost - 被动",desc:"幽灵守护者对物理伤害具有抗性。标记 1 压力点以穿过某个实体在近距离范围内移动。"},{name:"墓刃 Grave Blade - 动作",desc:"花费 1 恐惧点对一个邻近范围内的目标进行一次攻击。成功时，造成 2d10+6 点物理伤害，且目标必须标记 1 压力点。"}],url:"https://daggerheart.huijiwiki.com/wiki/%E5%B9%BD%E7%81%B5%E5%AE%88%E6%8A%A4%E8%80%85"},{id:"%E9%97%B4%E8%B0%8D",name:"间谍",original:"SPY",tier:2,type:"社交",difficulty:15,thresholds:[8,17],hp:4,stress:3,attack:{bonus:"−2",weapon:"匕首",range:"近战",damage:"2d6+3 物理",line:"攻击：−2 | 匕首：近战 | 2d6+3 物理"},experiences:"间谍活动+3",description:"一位擅长间谍活动的能手，总能出现在最适合偷听秘密的地方。",motives:"伺机脱身、伪装外貌、窃听情报",tierNote:"",features:[{name:"收集秘密 Gathering Secrets - 动作",desc:"花费 1 恐惧点来描述间谍如何得知场景中某位玩家角色的一个秘密。"},{name:"梁上君子 Fly on the Wall - 反应",desc:"当某位玩家角色或团队正在讨论敏感话题时，你可以标记 1 压力点来揭示间谍出现在场景中，正在观察他们。如果间谍成功逃离场景并向某人报告其发现，你获得 1d4 恐惧点。"}],url:"https://daggerheart.huijiwiki.com/wiki/%E9%97%B4%E8%B0%8D"},{id:"%E7%9F%B3%E5%BD%B1%E5%85%BD",name:"石影兽",original:"STONEWRAITH",tier:2,type:"潜伏",difficulty:13,thresholds:[11,22],hp:6,stress:3,attack:{bonus:"+3",weapon:"啃咬与利爪",range:"近战",damage:"2d8+6 物理",line:"攻击：+3 | 啃咬与利爪：近战 | 2d8+6 物理"},experiences:"岩石感知+3",description:"潜行的猎手，如同伏击的美洲豹，拥有板岩灰的石质身体。",motives:"保卫领地，隔离猎物，跟踪",tierNote:"",features:[{name:"石行者 Stonestrider - 被动",desc:"石影兽可以如同穿过空气般轻松地穿过石头和泥土。当身处石头或泥土中时，其处于 隐藏 状态并免疫所有伤害。"},{name:"岩石伏击 Rocky Ambush - 动作",desc:"在处于 隐藏 状态时，标记 1 压力点以跃至一个邻近范围内的目标的近战范围内。目标必须进行一次成功的敏捷或本能反应掷骰（15），否则将受到 2d8 点物理伤害并暂时处于 束缚 状态。"},{name:"雪崩咆哮 Avalanche Roar - 动作",desc:"在洞穴内时，花费 1 恐惧点进行咆哮并引发塌方。近距离范围内所有目标必须进行一次成功的敏捷反应掷骰（14），否则将受到 2d10 点物理伤害。碎石可以通过进展倒计时（8）清除。"},{name:"乘胜追击 Momentum - 反应",desc:"当石影兽成功命中玩家角色时，你获得 1 恐惧点。"}],url:"https://daggerheart.huijiwiki.com/wiki/%E7%9F%B3%E5%BD%B1%E5%85%BD"},{id:"%E6%88%90%E5%B9%B4%E9%97%AA%E5%85%89%E8%9C%93",name:"成年闪光蜓",original:"ADULT FLICKERFLY",tier:3,type:"独狼",difficulty:17,thresholds:[20,35],hp:12,stress:6,attack:{bonus:"+3",weapon:"翼斩",range:"邻近",damage:"3d20 物理",line:"攻击：+3 | 翼斩：邻近 | 3d20 物理"},experiences:"无",description:"一只体型如大型房屋般大小的有翼昆虫，拥有彩虹色的鳞片和快到无法追踪的翅膀。",motives:"收集闪亮物品、狩猎、筑巢、俯冲袭击",tierNote:"",features:[{name:"无情 Relentless （4） - 被动",desc:"在每个游戏主持人轮次中，此敌人可以至多被聚焦 4 次。像往常一样花费恐惧点来聚焦。"},{name:"从不失手 Never Misses - 被动",desc:"当成年闪光蜓攻击时，目标在对抗此次攻击时闪避值减半。"},{name:"致命飞行 Deadly Flight - 被动",desc:"飞行时，成年闪光蜓在使用一个动作前可以移动至远距离范围，而非近距离范围。"},{name:"旋风猛袭 Whirlwind - 动作",desc:"花费 1 恐惧点来旋转，对邻近范围内的所有目标发起攻击。成年闪光蜓成功命中的目标受到 3d8 直接物理伤害。"},{name:"心灵舞动 Mind Dance - 动作",desc:"标记 1 压力点以创造一个魔法炫目效果，影响附近敌人的心智。近距离范围内的所有目标必须进行一次本能反应掷骰。对于每个失败的目标而言，你获得 1 恐惧点，且成年闪光蜓得知一项目标所惧怕的事物。"},{name:"幻觉吐息 Hallucinatory Breath - 反应",desc:"倒计时 （循环 1d6）。 当成年闪光蜓第一次受到伤害时，启动倒计时。当倒计时触发时，成年闪光蜓向其正前方远距范围内所有目标吐出幻觉气体。目标必须成功进行一次本能反应掷骰，否则被恐怖的幻觉折磨。若成年闪光蜓已知目标所惧怕的事物，则该目标掷骰时处于劣势。失败的目标须标记 1 压力点并失去 1 希望点。"},{name:"奇异反射 Uncanny Reflexes - 反应",desc:"当成年闪光蜓在近距离范围内受到攻击伤害时，你可以标记 1 压力点以承受一半的伤害。"}],url:"https://daggerheart.huijiwiki.com/wiki/%E6%88%90%E5%B9%B4%E9%97%AA%E5%85%89%E8%9C%93"},{id:"%E8%B4%AA%E5%A9%AA%E6%81%B6%E9%AD%94",name:"贪婪恶魔",original:"DEMON OF AVARICE",tier:3,type:"辅助",difficulty:17,thresholds:[15,29],hp:6,stress:5,attack:{bonus:"+2",weapon:"饥饿巨口",range:"近战",damage:"3d6+5 物理",line:"攻击：+2 | 饥饿巨口：近战 | 3d6+5 物理"},experiences:"操弄+3",description:"身着华丽斗篷的怪兽，头顶环形犄角，犄角上镶嵌着珍宝。",motives:"吞噬、助长贪婪、挑拨离间",tierNote:"",features:[{name:"金钱开道 Money Talks - 被动",desc:"对恶魔的攻击会获得劣势，除非除非攻击者花费 1 把金币。该恶魔初始拥有与玩家角色数量相等把数的新币。当一个目标因恶魔的普通攻击而损失生命点时，他可以花费 1 把金币来取代标记生命点（每点生命点 1 把）。此特性中由玩家角色花费的每把金币，都会添加给恶魔。"},{name:"财额盈满 Numbers Must Go Up - 被动",desc:"为恶魔的攻击掷骰添加等同于其拥有金币把数的加值。"},{name:"钱即时间 Money Is Time - 动作",desc:"花费 3 把金币（或恐惧点）以聚焦 1d4+1 名盟友。"}],url:"https://daggerheart.huijiwiki.com/wiki/%E8%B4%AA%E5%A9%AA%E6%81%B6%E9%AD%94"},{id:"%E7%BB%9D%E6%9C%9B%E6%81%B6%E9%AD%94",name:"绝望恶魔",original:"DEMON OF DESPAIR",tier:3,type:"潜伏",difficulty:17,thresholds:[18,35],hp:6,stress:5,attack:{bonus:"+3",weapon:"瘴气之箭",range:"远距离",damage:"3d6+1 魔法",line:"攻击：+3 | 瘴气之箭：远距离 | 3d6+1 魔法"},experiences:"操弄+3",description:"一个身披斗篷的恶魔生物，拥有修长的四肢，不断渗出阴影。",motives:"让恐惧蔓延、隐藏在阴影中、动摇决心",tierNote:"",features:[{name:"绝望深渊 Depths of Despair - 被动",desc:"恶魔对拥有 0 希望点的玩家角色造成双倍伤害。"},{name:"挣扎无用 Your Struggle Is Pointless - 动作",desc:"花费 1 恐惧点来压制远距离范围内所有玩家角色的灵魂。所有受影响的目标将用 d8 替换其希望骰，直到掷出希望成功或下一次休息。"},{name:"汝友已败 Your Friends Will Fail You - 反应",desc:"当一名玩家角色恐惧失败时，你可以标记 1 压力点来使近距离范围内所有其他玩家角色失去 1 希望点。"},{name:"乘胜追击 Momentum - 反应",desc:"当恶魔成功命中玩家角色时，你获得 1 恐惧点。"}],url:"https://daggerheart.huijiwiki.com/wiki/%E7%BB%9D%E6%9C%9B%E6%81%B6%E9%AD%94"},{id:"%E5%82%B2%E6%85%A2%E6%81%B6%E9%AD%94",name:"傲慢恶魔",original:"DEMON OF HUBRIS",tier:3,type:"头目",difficulty:18,thresholds:[18,36],hp:7,stress:5,attack:{bonus:"+4",weapon:"完美长矛",range:"邻近",damage:"3d10 物理",line:"攻击：+4 | 完美长矛：邻近 | 3d10 物理"},experiences:"操弄+2",description:"一个完美无瑕却残忍无比的恶魔，手持闪闪发光的长矛，身着优雅的长袍。",motives:"居高临下、宣布提前胜利、证明优越性",tierNote:"",features:[{name:"惊怖 Terrifying - 被动",desc:"当恶魔成功攻击时，所有远距离范围内的玩家角色失去 1 希望点，而你获得 1 恐惧点。"},{name:"孤注一掷 Double or Nothing - 被动",desc:"当远距离范围内一名玩家角色掷骰失败，其可以选择重掷其恐惧骰，并采用新的结果。如果仍然失败，则必须标记 2 压力点且恶魔清除 1 压力点。"},{name:"无匹武艺 Unparalleled Skill - 动作",desc:"标记 1 压力点以对近距离范围内的一个目标造成恶魔的普通攻击伤害。"},{name:"邪恶之源 The Root of Villainy - 动作",desc:"花费 1 恐惧点以聚焦远距离范围内两个其他恶魔。"},{name:"汝等低劣 You Pale in Comparison - 反应",desc:"当恶魔近距离范围内一名玩家角色掷骰失败，其必须标记 1 压力点。"}],url:"https://daggerheart.huijiwiki.com/wiki/%E5%82%B2%E6%85%A2%E6%81%B6%E9%AD%94"},{id:"%E5%AB%89%E5%A6%92%E6%81%B6%E9%AD%94",name:"嫉妒恶魔",original:"DEMON OF JEALOUSY",tier:3,type:"远程",difficulty:17,thresholds:[17,30],hp:6,stress:6,attack:{bonus:"+4",weapon:"心灵突击",range:"远距离",damage:"3d8+3 魔法",line:"攻击：+4 | 心灵突击：远距离 | 3d8+3 魔法"},experiences:"操弄+3",description:"一个反复无常的生物，拥有细长的四肢和永不满足的欲望。",motives:"介入他人成功、侵占他人财产、心怀怨恨",tierNote:"",features:[{name:"无庇心智 Unprotected Mind - 被动",desc:"恶魔的普通攻击造成直接伤害。"},{name:"我的回合 My Turn - 反应",desc:"当恶魔因一次攻击标记生命点时，花费等同于恶魔标记的生命点的恐惧点，使攻击者也标记相同数值的生命点。"},{name:"纷争 Rivalry - 反应",desc:"当近距离范围内一个生物受到来自另一个敌人的伤害时，你可以标记 1 压力点来为伤害掷骰添加一个 d4。"},{name:"汝物归吾 What's Yours Is Mine - 反应",desc:"当恶魔邻近范围内的一名玩家角色受到严重伤害时，你可以花费 1 恐惧点来使目标进行一次灵巧反应掷骰。失败时，恶魔将从目标的物品栏中选择夺走一件物品或消耗品。"}],url:"https://daggerheart.huijiwiki.com/wiki/%E5%AB%89%E5%A6%92%E6%81%B6%E9%AD%94"},{id:"%E6%84%A4%E6%80%92%E6%81%B6%E9%AD%94",name:"愤怒恶魔",original:"DEMON OF WRATH",tier:3,type:"斗士",difficulty:17,thresholds:[22,40],hp:7,stress:5,attack:{bonus:"+3",weapon:"拳头",range:"邻近",damage:"3d8+1 魔法",line:"攻击：+3 | 拳头：邻近 | 3d8+1 魔法"},experiences:"威吓+2",description:"一个体型庞大的恶魔，拥有巨石般大小的拳头，被无尽的愤怒驱使。",motives:"助长怒火、震慑对手、大肆破坏",tierNote:"",features:[{name:"愤怒不熄 Anger Unrelenting - 被动",desc:"恶魔的攻击造成直接伤害。"},{name:"战斗欲望 Battle Lust - 动作",desc:"花费 1 恐惧点以使远距离范围内所有玩家角色热血沸腾。受影响角色将使用一枚 d20 作为其恐惧骰，直到场景结束。"},{name:"报复 Retaliation - 反应",desc:"当恶魔因来自近距离范围内一次攻击而受到伤害时，你可以标记 1 压力点来对攻击者进行一次普通攻击。"},{name:"血与灵魂 Blood and Souls - 反应",desc:"倒计时（循环 6）。 当恶魔视野内首次有攻击完成时启动。当玩家角色使用暴力动作时，它就会推进。当它触发时，召唤 1d4 只小型恶魔，出现在近距离范围。"}],url:"https://daggerheart.huijiwiki.com/wiki/%E6%84%A4%E6%80%92%E6%81%B6%E9%AD%94"},{id:"%E5%B7%A8%E5%9E%8B%E8%9D%99%E8%9D%A0",name:"巨型蝙蝠",original:"DIRE BAT",tier:3,type:"潜伏",difficulty:14,thresholds:[16,30],hp:5,stress:3,attack:{bonus:"+2",weapon:"爪牙",range:"近战",damage:"2d6+7 物理",line:"攻击：+2 | 爪牙：近战 | 2d6+7 物理"},experiences:"嗜血+3",description:"一种翼展宽大的宠物，对其吸血鬼主人无限忠诚。",motives:"俯冲轰炸、隐藏、保护首领",tierNote:"",features:[{name:"飞行 Flying - 被动",desc:"飞行时，巨型蝙蝠的难度获得 +3 加值。"},{name:"尖啸 Screech - 动作",desc:"标记 1 压力点以向巨型蝙蝠前方远距离范围内的所有目标发出高频尖啸。这些目标必须标记 1d4 压力点。"},{name:"守护者 Guardian - 反应",desc:"当一个盟友吸血鬼标记生命点时，你可以标记 1 压力点飞行至攻击者的近战范围内并对其进行一次具有优势的攻击。成功时，造成 2d6+2 点物理伤害。"}],url:"https://daggerheart.huijiwiki.com/wiki/%E5%B7%A8%E5%9E%8B%E8%9D%99%E8%9D%A0"},{id:"%E6%A0%91%E7%B2%BE",name:"树精",original:"DRYAD",tier:3,type:"头目",difficulty:16,thresholds:[24,38],hp:8,stress:5,attack:{bonus:"+4",weapon:"枯木短弓",range:"远距离",damage:"3d10+1 物理",line:"攻击：+4 | 枯木短弓：远距离 | 3d10+1 物理"},experiences:"森林知识+4",description:"一个以人形树木形态存在的自然精灵。",motives:"指挥、栽培、驱逐、保护森林",tierNote:"",features:[{name:"荆棘丛 Bramble Patch - 动作",desc:"标记 1 压力点以指定远距离范围内的一个点。在目标点近距离范围内创造一片荆棘丛。该区域内的所有目标在其行动时会受到 2d6+2 点物理伤害。目标必须进行一次灵巧掷骰并成功，或者通过攻击对树精造成超过20点伤害才能离开该区域。"},{name:"生长树苗 Grow Saplings - 动作",desc:"花费 1 恐惧点以生长三个树人幼苗杂兵，它们出现在近距离范围内并立即获得聚焦。"},{name:"我们合为一体 We Are All One - 反应",desc:"当一个盟友在近距离范围内死亡时，其生命力回归了森林，使树精可以花费 1 恐惧点以恢复 2 生命点并清除 2 压力点。"}],url:"https://daggerheart.huijiwiki.com/wiki/%E6%A0%91%E7%B2%BE"},{id:"%E5%85%83%E7%B4%A0%E7%81%AB%E8%8A%B1",name:"元素火花",original:"ELEMENTAL SPARK",tier:3,type:"杂兵",difficulty:15,thresholds:[null,null],hp:1,stress:1,attack:{bonus:"+0",weapon:"火焰爆发",range:"近距离",damage:"5 魔法",line:"攻击：+0 | 火焰爆发：近距离 | 5 魔法"},experiences:"",description:"一团炽热的元素火焰微粒。",motives:"冲击、吞噬、聚集成团",tierNote:"",features:[{name:"杂兵 Minion （9） - 被动",desc:"当元素火花受到任何伤害时，其即被击败。玩家角色每对元素火花造成 9 点伤害，则在攻击能够成功命中的范围内额外击败一个杂兵。"},{name:"群体攻击 Group Attack - 动作",desc:"花费 1 恐惧点，选择一个目标，并聚焦目标近距离范围内的所有元素火花。将这些元素火花移动到目标的近战范围内，并进行一次共享攻击掷骰。成功时，每个元素火花造成 5 点物理伤害。将这些伤害合并计算。"}],url:"https://daggerheart.huijiwiki.com/wiki/%E5%85%83%E7%B4%A0%E7%81%AB%E8%8A%B1"},{id:"%E9%AB%98%E9%98%B6%E5%9C%9F%E5%85%83%E7%B4%A0",name:"高阶土元素",original:"GREATER EARTH ELEMENTAL",tier:3,type:"斗士",difficulty:17,thresholds:[22,40],hp:10,stress:4,attack:{bonus:"+7",weapon:"巨石之拳",range:"邻近",damage:"3d10+1 物理",line:"攻击：+7 | 巨石之拳：邻近 | 3d10+1 物理"},experiences:"",description:"由巨石和尘土组成的活体山崩，如同房屋般巨大。",motives:"雪崩、击倒、重击",tierNote:"",features:[{name:"迟缓 Slow - 被动",desc:"当你聚焦高阶土元素，且其数据块上没有指示物时，它无法立即行动。在它的数据块上放置一个标记，并描述它正在准备做什么。当你聚焦高阶土元素，且其数据块上有指示物时，移除指示物，它才可以行动。"},{name:"粉碎打击 Crushing Blows - 被动",desc:"当高阶土元素成功攻击时，目标必须标记 1 护甲槽，但不能获得其益处（其仍然可以使用护甲来减少伤害）。如果目标无法标记护甲槽，则必须额外标记 1 生命点。"},{name:"不可撼动之物 Immovable Object - 被动",desc:"当一个攻击会使高阶土元素移动时，减少两个范围等级（例如，远距离变为邻近范围）。当高阶土元素受到物理伤害时，将其减少7点。"},{name:"石崩 Rockslide - 动作",desc:"标记 1 压力点制造一场石崩，用落石覆盖高阶土元素前方近距离范围内的区域。该区域内的所有目标必须进行一次敏捷反应掷骰（19）。失败则受到 2d12+5 点物理伤害，并在下次骰出希望结果之前处于 脆弱 状态。成功则受到一半伤害。"},{name:"乘胜追击 Momentum - 反应",desc:"当高阶土元素成功命中玩家角色时，你获得 1 恐惧点。"}],url:"https://daggerheart.huijiwiki.com/wiki/%E9%AB%98%E9%98%B6%E5%9C%9F%E5%85%83%E7%B4%A0"},{id:"%E9%AB%98%E9%98%B6%E6%B0%B4%E5%85%83%E7%B4%A0",name:"高阶水元素",original:"GREATER WATER ELEMENTAL",tier:3,type:"辅助",difficulty:17,thresholds:[17,34],hp:5,stress:5,attack:{bonus:"+3",weapon:"巨浪",range:"邻近",damage:"3d4+1 魔法",line:"攻击：+3 | 巨浪：邻近 | 3d4+1 魔法"},experiences:"",description:"一道巨大的活体波浪，向敌人汹涌扑去。",motives:"洪水、驱散、淹没",tierNote:"",features:[{name:"水流喷射 Water Jet - 动作",desc:"标记 1 压力点攻击邻近范围内的一个目标。成功时，造成 2d4+7 点物理伤害，且目标的下一次动作具有劣势。失败时，目标必须标记 1 压力点。"},{name:"溺毙拥抱 Drowning Embrace - 动作",desc:"花费 1 恐惧点对邻近范围内的所有目标进行攻击。元素生物成功攻击的目标会因为溺水而处于 束缚 和 脆弱 状态。目标可以通过成功的力量或本能掷骰挣脱，以结束这两种状态。"},{name:"涨潮 High Tide - 反应",desc:"当高阶水元素成功进行普通攻击时，你可以标记 1 压力点将目标击退至近距离范围。"}],url:"https://daggerheart.huijiwiki.com/wiki/%E9%AB%98%E9%98%B6%E6%B0%B4%E5%85%83%E7%B4%A0"},{id:"%E5%B7%A8%E5%9E%8B%E7%BB%BF%E8%89%B2%E8%BD%AF%E6%B3%A5%E6%80%AA",name:"巨型绿色软泥怪",original:"HUGE GREEN OOZE",tier:3,type:"潜伏",difficulty:15,thresholds:[15,30],hp:7,stress:4,attack:{bonus:"+3",weapon:"软泥触肢",range:"近战",damage:"3d8+1 魔法",line:"攻击：+3 | 软泥触肢：近战 | 3d8+1 魔法"},experiences:"融入+3",description:"一个比大多数人类都高的半透明绿色酸液堆。",motives:"伪装、悄悄靠近、吞没、繁殖",tierNote:"",features:[{name:"迟缓 Slow - 被动",desc:"当你聚焦巨型绿色软泥怪，且其数据块上没有指示物时，它无法立即行动。在它的数据块上放置一个标记，并描述它正在准备做什么。当你聚焦巨型绿色软泥怪，且其数据块上有指示物时，移除指示物，它才可以行动。"},{name:"酸性形态 Acidic Form - 被动",desc:"当巨型绿色软泥怪攻击成功时，目标必须标记 1 护甲槽，且不获得其效果（其仍然可以使用护甲来减少伤害）。如果目标无法标记护甲槽，则必须额外标记 1 生命点。"},{name:"吞没 Envelop - 动作",desc:"对近战范围内的一个目标进行一次普通攻击。成功时，巨型绿色软泥怪会将其 吞没 ，目标必须标记 2 压力点。处于 吞没 状态期间，目标每次进行动作掷骰时都必须额外标记 1 压力点。当巨型绿色软泥怪受到重伤时，所有处于 吞没 状态的目标都会被解放，且该状态被清除。"},{name:"分裂 Split - 反应",desc:"当巨型绿色软泥怪标记了 4 或更多生命点时，你可以花费 1 恐惧点将其分裂成两个绿色软泥怪（没有标记的生命点或压力点），并立即聚焦。"}],url:"https://daggerheart.huijiwiki.com/wiki/%E5%B7%A8%E5%9E%8B%E7%BB%BF%E8%89%B2%E8%BD%AF%E6%B3%A5%E6%80%AA"},{id:"%E5%A4%9A%E5%A4%B4%E8%9B%87",name:"多头蛇",original:"HYDRA",tier:3,type:"独狼",difficulty:18,thresholds:[19,35],hp:10,stress:5,attack:{bonus:"+3",weapon:"撕咬",range:"近距离",damage:"2d12+2 物理",line:"攻击：+3 | 撕咬：近距离 | 2d12+2 物理"},experiences:"",description:"一种四足有鳞的野兽，长着多个长颈头颅，每个头都长满了骇人的獠牙。",motives:"吞食、再生、恐吓",tierNote:"",features:[{name:"多头威胁 Many-Headed Menace - 被动",desc:"多头蛇开始时有三个头，最多可以拥有五个头。当多头蛇受到重度或更重的伤害时，它会失去一个头。"},{name:"无情 Relentless （X） - 被动",desc:"在每个游戏主持人轮次中，多头蛇可以至多被聚焦 X 次，其中 X 是多头蛇的头数。像往常一样花费恐惧点来聚焦。"},{name:"再生 Regeneration - 动作",desc:"如果多头蛇有任何已标记的生命点，花费 1 恐惧点来恢复 1 再生生命点并长出两个头。"},{name:"恐怖合唱 Terrifying Chorus - 动作",desc:"远距离范围内的所有玩家角色失去 2 希望 点。"},{name:"魔法弱点 Magical Weakness - 反应",desc:"当多头蛇受到魔法伤害时，它会处于 恍惚 状态，直到下一次有玩家角色掷出恐惧结果。处于 恍惚 状态时，它无法使用再生动作，但免疫魔法伤害。"}],url:"https://daggerheart.huijiwiki.com/wiki/%E5%A4%9A%E5%A4%B4%E8%9B%87"},{id:"%E5%90%9B%E4%B8%BB",name:"君主",original:"MONARCH",tier:3,type:"社交",difficulty:16,thresholds:[16,32],hp:6,stress:5,attack:{bonus:"+0",weapon:"战锤",range:"近战",damage:"3d6+3 物理",line:"攻击：+0 | 战锤：近战 | 3d6+3 物理"},experiences:"历史+3，贵族身份+3",description:"统治一个国家的至高君主，身披传统赋予的特权，在其领土内拥有无与伦比的力量。",motives:"控制封臣、消灭对手、铸造传奇",tierNote:"",features:[{name:"处死他们！ Execute Them！ - 动作",desc:"为每位玩家角色花费 1 恐惧点，使队伍因真实或想象的罪行而被判有罪。玩家角色在风度掷骰中成功可以要求进行比武审判或其他特殊形式的审判。"},{name:"王冠卫队 Crownsguard - 动作",desc:"每场景一次，标记 1 压力点召唤六个 位阶3 杂兵，他们出现在近距离范围内执行君主的旨意。"},{name:"战争借口 Casus Belli - 反应",desc:"长期倒计时（8），在君主对战争的渴望首次显露后，花费 1 恐惧点来激活。当触发时，君主将获得一个足以动员全国参战的正当理由，并掌握付诸行动所需的支持力量。你获得 1d4 恐惧点。"}],url:"https://daggerheart.huijiwiki.com/wiki/%E5%90%9B%E4%B8%BB"},{id:"%E9%9B%84%E9%B9%BF%E9%AA%91%E5%A3%AB",name:"雄鹿骑士",original:"STAG KNIGHT",tier:3,type:"标准",difficulty:17,thresholds:[19,36],hp:7,stress:5,attack:{bonus:"+3",weapon:"荆棘剑",range:"近战",damage:"3d8+3 物理",line:"攻击：+3 | 荆棘剑：近战 | 3d8+3 物理"},experiences:"森林知识+3",description:"一位身披危险荆棘制成的盔甲，长着巨大、雄伟鹿角的骑士。",motives:"孤立、机动、保卫森林、清除不受欢迎者",tierNote:"",features:[{name:"自上方而来 From Above - 被动",desc:"当骑士自目标上方发起的普通攻击成功时，造成的物理伤害为 3d12+3，而非普通伤害。"},{name:"森林之刃 Blade of the Forest - 动作",desc:"花费 1 恐惧点，对邻近范围内的所有目标进行攻击。骑士成功攻击的目标将受到等同于 3d4 + 目标的重度伤害阈值的物理伤害。"},{name:"荆棘护甲 Thorny Armor - 反应",desc:"当骑士受到近战范围内攻击的伤害时，你可以标记 1 压力点，对攻击者造成 1d10+5 点物理伤害。"}],url:"https://daggerheart.huijiwiki.com/wiki/%E9%9B%84%E9%B9%BF%E9%AA%91%E5%A3%AB"},{id:"%E6%A9%A1%E6%9C%A8%E6%A0%91%E4%BA%BA",name:"橡木树人",original:"OAK TREANT",tier:3,type:"斗士",difficulty:17,thresholds:[22,40],hp:7,stress:4,attack:{bonus:"+2",weapon:"树枝",range:"邻近",damage:"3d8+2 物理",line:"攻击：+2 | 树枝：邻近 | 3d8+2 物理"},experiences:"森林知识+3",description:"一棵坚固的活化古树。",motives:"隐于视野、保护森林、扎根、挥舞树枝",tierNote:"",features:[{name:"只是一棵树 Just a Tree - 被动",desc:"在橡木树人发动战斗中的首次攻击前，或处于 隐藏 状态后，它与普通树木毫无区别。该伪装效果将持续至其下次行动，或当某位玩家角色成功通过本能掷骰时识破其真身。"},{name:"种子弹幕 Seed Barrage - 动作",desc:"标记 1 压力点，对近距离范围内的最多三个目标进行攻击，用巨大的橡子猛击他们。橡木树人成功攻击的目标将受到 2d10+5 点物理伤害。"},{name:"扎根 Take Root - 动作",desc:"标记 1 压力点，使树人 扎根 在原地。橡木树人处于 扎根 状态期间亦处于 束缚 状态，并且可以在轮到它行动时选择结束此效果而不是移动。处于 扎根 状态期间，树人对物理伤害具有抗性。"}],url:"https://daggerheart.huijiwiki.com/wiki/%E6%A9%A1%E6%9C%A8%E6%A0%91%E4%BA%BA"},{id:"%E6%A0%91%E4%BA%BA%E5%B9%BC%E8%8B%97",name:"树人幼苗",original:"TREANT SAPLING",tier:3,type:"杂兵",difficulty:14,thresholds:[null,null],hp:1,stress:1,attack:{bonus:"+0",weapon:"树枝",range:"近战",damage:"8 物理",line:"攻击：+0 | 树枝：近战 | 8 物理"},experiences:"",description:"一棵小型、有感知能力的树木幼苗。",motives:"融入环境、保护森林、猛击、包围",tierNote:"",features:[{name:"杂兵 Minion （6） - 被动",desc:"当树人幼苗受到任何伤害时，其即被击败。玩家角色每对树人幼苗造成 6 点伤害，则在攻击能够成功命中的范围内额外击败一个杂兵。"},{name:"群体攻击 Group Attack - 动作",desc:"花费 1 恐惧点，选择一个目标，并聚焦目标近距离范围内
