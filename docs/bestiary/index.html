的所有树人幼苗。将这些树人幼苗移动到目标的近战范围内，并进行一次共享攻击掷骰。成功时，每个树人幼苗造成 8 点物理伤害。将这些伤害合并计算。"}],url:"https://daggerheart.huijiwiki.com/wiki/%E6%A0%91%E4%BA%BA%E5%B9%BC%E8%8B%97"},{id:"%E5%90%B8%E8%A1%80%E9%AC%BC%E9%A6%96%E9%A2%86",name:"吸血鬼首领",original:"HEAD VAMPIRE",tier:3,type:"头目",difficulty:17,thresholds:[22,42],hp:6,stress:6,attack:{bonus:"+5",weapon:"细剑",range:"近战",damage:"2d20+4 物理",line:"攻击：+5 | 细剑：近战 | 2d20+4 物理"},experiences:"贵族+3",description:"一位身着贵族华服的迷人亡灵。",motives:"创造奴仆、魅惑、指挥、飞行、威吓",tierNote:"",features:[{name:"惊怖 Terrifying - 被动",desc:"当吸血鬼首领成功攻击时，所有远距离范围内的玩家角色失去 1 希望点，而你获得 1 恐惧点。"},{name:"注视吾眼 Look into My Eyes - 被动",desc:"进入吸血鬼首领近战范围的生物必须进行一次本能反应掷骰。失败时，你获得 1d4 恐惧点。"},{name:"吸取随从 Feed on Followers - 动作",desc:"当吸血鬼首领处于一名盟友的近战范围内时，其可以使该盟友标记 1 生命点值。随后吸血鬼首领恢复 1 生命点。"},{name:"狩猎开始 The Hunt Is On - 动作",desc:"花费 2 恐惧点以召唤 1d4 只吸血鬼，他们出现在远距离范围处且立即获得聚焦。"},{name:"生命吸取 Lifesuck - 反应",desc:"当吸血鬼首领被聚焦时，掷出一个 d8 。如果结果为6或更高，所有邻近范围内的目标必须标记 1 生命点。"}],url:"https://daggerheart.huijiwiki.com/wiki/%E5%90%B8%E8%A1%80%E9%AC%BC%E9%A6%96%E9%A2%86"},{id:"%E5%90%B8%E8%A1%80%E9%AC%BC",name:"吸血鬼",original:"VAMPIRE",tier:3,type:"标准",difficulty:16,thresholds:[18,35],hp:5,stress:4,attack:{bonus:"+3",weapon:"细剑",range:"近战",damage:"3d8 物理",line:"攻击：+3 | 细剑：近战 | 3d8 物理"},experiences:"野性猎手+3",description:"一个拥有智力的亡灵，嘴唇上沾满鲜血，嘴角带着掠食者的微笑。",motives:"咬噬、魅惑、欺瞒、进食、威吓",tierNote:"",features:[{name:"吸血咬噬 Draining Bite - 动作",desc:"对近战范围内的一个目标进行一次攻击。成功时，造成 5d4 物理伤害。因此次攻击标记生命点的目标，失去 1 希望点且必须标记 1 压力点。吸血鬼随后恢复 1 生命点值。"},{name:"迷雾形态 Mistform - 反应",desc:"当吸血鬼受到物理伤害时，你可以花费 1 恐惧点只承受一半伤害。"}],url:"https://daggerheart.huijiwiki.com/wiki/%E5%90%B8%E8%A1%80%E9%AC%BC"},{id:"%E5%AE%9D%E5%BA%93%E5%AE%88%E5%8D%AB%E5%85%B8%E7%8B%B1%E9%95%BF",name:"宝库守卫典狱长",original:"VAULT GUARDIAN GAOLER",tier:2,type:"辅助",difficulty:16,thresholds:[19,33],hp:5,stress:3,attack:{bonus:"+2",weapon:"躯体猛击",range:"邻近",damage:"3d6+2 物理",line:"攻击：+2 | 躯体猛击：邻近 | 3d6+2 物理"},experiences:"",description:"一个方正、布满灰尘的构装体，躯干上有着厚重的金属摆门。",motives:"搬走、困住、保护、猛击",tierNote:"",features:[{name:"格挡之盾 Blocking Shield - 被动",desc:"宝库守卫典狱长近战范围内的生物对其进行攻击掷骰时具有劣势。被困在宝库守卫典狱长体内的生物免疫此特性。"},{name:"封锁囚禁 Lock Up - 动作",desc:"标记 1 压力点对邻近范围内的目标进行一次攻击。成功时，目标会被囚禁在狱卒体内处于 束缚 状态，直到通过一次成功的力量掷骰（18）成功逃脱。处于 束缚 状态的目标只能攻击宝库守卫典狱长。"}],url:"https://daggerheart.huijiwiki.com/wiki/%E5%AE%9D%E5%BA%93%E5%AE%88%E5%8D%AB%E5%85%B8%E7%8B%B1%E9%95%BF"},{id:"%E5%AE%9D%E5%BA%93%E5%AE%88%E5%8D%AB%E5%93%A8%E5%85%B5",name:"宝库守卫哨兵",original:"VAULT GUARDIAN SENTINEL",tier:3,type:"斗士",difficulty:17,thresholds:[21,40],hp:6,stress:3,attack:{bonus:"+3",weapon:"充能钉头锤",range:"邻近",damage:"2d12+1 物理",line:"攻击：+3 | 充能钉头锤：邻近 | 2d12+1 物理"},experiences:"",description:"一个布满灰尘的金色构装体，有着方正的肢体和一只巨大的钉头锤作为手。",motives:"不惜一切代价破坏、清除、保护",tierNote:"",features:[{name:"动能猛击 Kinetic Slam - 被动",desc:"受到宝库守卫哨兵普通攻击伤害的目标会被击退至邻近范围。"},{name:"围困压制 Box In - 动作",desc:"标记 1 压力点选择一个邻近范围内的目标进行围困。当该目标处于宝库守卫哨兵的邻近范围内时，其攻击掷骰具有劣势。宝库守卫哨兵一次只能围困一个目标。"},{name:"法力箭 Mana Bolt - 动作",desc:"花费 1 恐惧点向远距离范围内的一个点投掷爆炸魔法。该点邻近范围内的所有目标必须进行一次敏捷反应掷骰。失败的目标受到2d8+20点魔法伤害并被击退至近距离范围。成功的目标受到一半伤害且不会被击退。"},{name:"乘胜追击 Momentum - 反应",desc:"当宝库守卫哨兵成功命中玩家角色时，你获得 1 恐惧点。"}],url:"https://daggerheart.huijiwiki.com/wiki/%E5%AE%9D%E5%BA%93%E5%AE%88%E5%8D%AB%E5%93%A8%E5%85%B5"},{id:"%E5%AE%9D%E5%BA%93%E5%AE%88%E5%8D%AB%E7%82%AE%E5%8F%B0",name:"宝库守卫炮台",original:"VAULT GUARDIAN TURRET",tier:3,type:"远程",difficulty:16,thresholds:[20,32],hp:5,stress:4,attack:{bonus:"+3",weapon:"魔导炮",range:"远距离",damage:"3d10+3 魔法",line:"攻击：+3 | 魔导炮：远距离 | 3d10+3 魔法"},experiences:"",description:"一座巨大的活动炮台，拥有加固装甲和十二条活塞驱动的机械腿。",motives:"集中火力、锁定、标记、保护",tierNote:"",features:[{name:"慢速射击 Slow Firing - 被动",desc:"当你聚焦宝库守卫炮台且其数据块上没有指示物时，其无法进行普通攻击。在其数据块放置一个指示物，并描述其正在准备做什么。当你聚焦宝库守卫炮台且其数据块上有指示物时，移除指示物，其可以进行攻击。"},{name:"标记目标 Mark Target - 动作",desc:"花费 1 恐惧点以 标记远距离范围内的一个目标，直到宝库守卫炮台被摧毁或被标记的目标处于 隐藏 状态。当目标处于 标记 状态时，其闪避值减半。"},{name:"集中火力 Concentrate Fire - 反应",desc:"当另一个敌人对宝库守卫炮台远距离范围内的一个目标造成伤害时，你可以标记 1 压力点将宝库守卫炮台的普通攻击伤害加到伤害掷骰中。"},{name:"引爆 Detonation - 反应",desc:"当宝库守卫炮台被摧毁时，其会爆炸。近距离范围内的所有目标必须进行一次敏捷反应掷骰。失败的目标受到3d20点物理伤害。成功的目标受到一半伤害。"}],url:"https://daggerheart.huijiwiki.com/wiki/%E5%AE%9D%E5%BA%93%E5%AE%88%E5%8D%AB%E7%82%AE%E5%8F%B0"},{id:"%E9%9D%92%E5%B9%B4%E5%86%B0%E9%BE%99",name:"青年冰龙",original:"YOUNG ICE DRAGON",tier:3,type:"独狼",difficulty:18,thresholds:[21,41],hp:10,stress:6,attack:{bonus:"+7",weapon:"啃咬与利爪",range:"近距离",damage:"4d10 物理",line:"攻击：+7 | 啃咬与利爪：近距离 | 4d10 物理"},experiences:"护卫所有物+3",description:"一条冰川蓝色的巨龙，拥有四条强健的肢体和带霜的翅膀。",motives:"雪崩、保卫巢穴、飞行、冰冻、护卫所有物、撕咬",tierNote:"",features:[{name:"无情 Relentless （3） - 被动",desc:"在每个游戏主持人轮次中，青年冰龙可以至多被聚焦 3 次。像往常一样花费恐惧点来聚焦。"},{name:"撕裂与碾碎 Rend and Crush - 被动",desc:"如果受到青年冰龙伤害的目标没有标记护甲槽来减少伤害，其必须标记 1 压力点。"},{name:"扑灭希望 No Hope - 被动",desc:"当玩家角色在青年冰龙的远距离范围内骰出恐惧结果时，其失去 1 希望点。"},{name:"暴风雪吐息 Blizzard Breath - 动作",desc:"花费 2 恐惧点在青年冰龙前方的近距离范围内释放一道寒冰旋风。该区域内的所有目标必须进行一次敏捷反应掷骰。失败的目标受到4d6+5点魔法伤害并被冻结处于 束缚 状态，直到其进行一次成功的力量掷骰挣脱为止。成功的目标必须标记 2 压力点或受到一半伤害。"},{name:"雪崩 Avalanche - 动作",desc:"花费 1 恐惧点让青年冰龙释放一场巨大的冰雪崩塌，覆盖远距离范围内的所有其他生物。该区域内的所有目标必须进行一次成功的本能反应掷骰，否则将被埋在雪和岩石中，处于 脆弱 状态，直到其清除自身的掩埋物。每有一个玩家角色在该反应掷骰中失败，你获得 1 恐惧点。"},{name:"冰冻鳞片 Frozen Scales - 反应",desc:"当一个生物在邻近范围内对青年冰龙进行一次成功的攻击时，其必须标记 1 压力点并处于 寒冷 状态，直到其下次休息或清除 1 压力点为止。当其处于 寒冷 状态时，其在攻击掷骰中具有劣势。"},{name:"乘胜追击 Momentum - 反应",desc:"当青年冰龙成功命中玩家角色时，你获得 1 恐惧点。"}],url:"https://daggerheart.huijiwiki.com/wiki/%E9%9D%92%E5%B9%B4%E5%86%B0%E9%BE%99"},{id:"%E8%87%B3%E9%AB%98%E6%AD%BB%E7%81%B5%E5%B8%88",name:"至高死灵师",original:"ARCH-NECROMANCER",tier:4,type:"头目",difficulty:21,thresholds:[33,66],hp:9,stress:8,attack:{bonus:"+6",weapon:"黯能爆裂",range:"远距离",damage:"4d12+8 魔法",line:"攻击：+6 | 黯能爆裂：远距离 | 4d12+8 魔法"},experiences:"禁忌学识+3，千年智识+3",description:"身披破烂法袍的衰朽魔法师",motives:"腐蚀，枯化，及时撤退，改日再战",tierNote:"",features:[{name:"死骸之舞 Dance of Death - 动作",desc:"标记 1 压力点以聚焦1d4名盟友。以此法被聚焦的盟友的攻击仅会造成一半伤害，你也可以花费 1 恐惧点改为造成全部伤害。"},{name:"衰朽光束 Beam of Decay - 动作",desc:"标记 2 压力点以令远距离范围内的所有目标进行一次力量反应掷骰。失败者受2d20+12点魔法伤害且你获得 1 恐惧点。成功则仅受半额伤害。标记 2或更多 生命点的生物还必须再 标记 2 压力点，且处于 脆弱 状态，直至骰出希望结果。"},{name:"开启冥途之门 Open the Gates of Death - 动作",desc:"花费 1 恐惧点以召唤一支丧尸军团，其将在近距离范围处出现且立即获得聚焦。"},{name:"后会有期，朋友们 Not Today，My Dears - 反应",desc:"*当至高死灵师 标记 7或更多 生命点 后，你可以花费 1 恐惧点以将其传送至某个可以令其休整的安全地点。玩家角色可以进行一次本能掷骰，成功即可追踪到此次传送魔法的目的地。"},{name:"你命归我 Your Life Is Mine - 反应",desc:"倒计时（循环2d6）。*当至高死灵师 标记 6或更多 生命点 后，启动倒计时。其在触发时将会对一个近距离范围内的生物造成2d10+6点直接魔法伤害。至高死灵师随后清除一定数量压力点或恢复一定数量的生命点，数量等于目标因此次攻击而标记的生命点数量。"}],url:"https://daggerheart.huijiwiki.com/wiki/%E8%87%B3%E9%AB%98%E6%AD%BB%E7%81%B5%E5%B8%88"},{id:"%E5%A0%95%E5%A4%A9%E7%AA%81%E5%87%BB%E5%85%B5",name:"堕天突击兵",original:"FALLEN SHOCK TROOP",tier:4,type:"杂兵",difficulty:18,thresholds:[null,null],hp:1,stress:1,attack:{bonus:"+2",weapon:"受咒之斧",range:"邻近",damage:"12 物理",line:"攻击：+2 | 受咒之斧：邻近 | 12 物理"},experiences:"",description:"身缠诅咒的亡魂，被那陨天之神的意志所缚",motives:"粉碎，支配，得到救赎，惩戒",tierNote:"",features:[{name:"杂兵 Minion（12） - 被动",desc:"当堕天突击兵受到任何伤害时，其即被击败。玩家角色每对堕天突击兵造成 12 点伤害，则在攻击能够成功命中的范围内额外击败一个杂兵。"},{name:"毁灭灵光 Aura of Doom - 被动",desc:"当一位玩家角色因堕天突击兵的一次攻击而标记生命点时，将失去 1 希望点。"},{name:"群体攻击 Group Attack - 动作",desc:"花费 1 恐惧点，选择一个目标，并聚焦目标附近近距离范围内的所有堕天突击兵。将这些堕天突击兵移动到目标的近战范围内，并进行一次共享攻击掷骰。成功时，每个堕天突击兵造成 12 点伤害。将这些伤害合并计算。"}],url:"https://daggerheart.huijiwiki.com/wiki/%E5%A0%95%E5%A4%A9%E7%AA%81%E5%87%BB%E5%85%B5"},{id:"%E5%A0%95%E5%A4%A9%E6%9C%AF%E5%A3%AB",name:"堕天术士",original:"FALLEN SORCERER",tier:4,type:"辅助",difficulty:19,thresholds:[26,42],hp:6,stress:5,attack:{bonus:"+4",weapon:"腐化法杖",range:"远距离",damage:"4d6+10 魔法",line:"攻击：+4 | 腐化法杖：远距离 | 4d6+10 魔法"},experiences:"远古学识+2",description:"被生前所缔结的契约束缚的强大魔法师",motives:"获取，心碎，支配，折磨",tierNote:"",features:[{name:"焚天业火 Conflagration - 动作",desc:"花费 1 恐惧点释放毁灭万物的业火风暴，对近距离内的所有目标发动一次攻击。堕天术士对被攻击成功的目标造成 2d10+6 点直接魔法伤害。"},{name:"编织噩梦 Nightmare Tableau - 动作",desc:"标记 1 压力点将远距离范围内的一个生物以其内心深处最害怕的事物形成的幻象所缚。目标在被缚期间处于 束缚 和 脆弱 状态。目标可以通过成功的本能掷骰挣脱，以清除这两种状态。"},{name:"滑移 Slippery - 反应",desc:"当堕天术士因一次攻击而受到伤害时，其可以传送至多至远距离范围。"},{name:"孽罪枷锁 Shackles of Guilt - 反应",desc:"倒计时（循环2d6）。当堕天术士首次被聚焦时，启动倒计时。其在触发时将令远距离范围内的所有目标处于 脆弱 状态且因直面其所经历过最大的愧疚而必须标记 1 压力点。目标可以通过一次成功的风度或力量掷骰来重获自由，但若该尝试失败则会失去 1 希望点。"}],url:"https://daggerheart.huijiwiki.com/wiki/%E5%A0%95%E5%A4%A9%E6%9C%AF%E5%A3%AB"},{id:"%E5%A0%95%E5%A4%A9%E6%88%98%E7%A5%9E%EF%BC%9A%E7%A0%B4%E5%9F%9F%E8%80%85",name:"堕天战神：破域者",original:"FALLEN WARLORD：REALM-BREAKER",tier:4,type:"独狼",difficulty:20,thresholds:[36,66],hp:8,stress:5,attack:{bonus:"+7",weapon:"棘刃长鞭",range:"近距离",damage:"4d8+7 物理",line:"攻击：+7 | 棘刃长鞭：近距离 | 4d8+7 物理"},experiences:"征服+3，历史+2，威吓+3",description:"一位堕落之神，沉沦于怨念与愤恨之中，无数英灵殁于其锋。",motives:"腐蚀，支配，惩戒，攻破弱点",tierNote:"",features:[{name:"无情 Relentless (2) - 被动",desc:"在每个游戏主持人轮次中，破域者可以至多被聚焦 2 次。像往常一样花费恐惧点来聚焦。"},{name:"恨火之铠 Firespite Plate Armor - 被动",desc:"破域者受到伤害时将其数值降低2d10。"},{name:"磨难鞭笞 Tormenting Lash - 动作",desc:"标记 1 压力点对邻近范围的所有目标发动一次普通攻击。若目标使用护甲降低此次攻击的伤害，则其必须标记 2 护甲槽。"},{name:"怒噬万物 All-Consuming Rage - 反应",desc:"倒计时（递减8）。当破域者首次被聚焦时，启动倒计时。其在触发时将创造盛怒具现而成的洪流，搅碎血肉，磨灭骨骸。远距离范围内的每个生物都必须进行一次风度反应掷骰。失败者受到 2d6+10 点直接魔法伤害，成功则伤害减半。目标每因此伤害标记 1 生命点，就会有一个堕天突击兵被召唤现身于其邻近范围内。若倒计时的上限值降至0，则破域者标记其所有剩余的生命点且远距离范围内的所有目标都必须标记其所有剩余的生命点并进行死亡行动。"},{name:"末日凶兆 Doombringer - 反应",desc:"当目标因破域者的攻击而标记生命点时，所有位于目标远距离范围内的玩家角色都失去 1 希望点。"},{name:"未尝一败 I Have Never Known Defeat - 反应",desc:"（形态切换 Phase Change），当破域者标记其最后 1 生命点时，将其替换为堕天战神：无败冠军并立即给予其聚焦。"}],url:"https://daggerheart.huijiwiki.com/wiki/%E5%A0%95%E5%A4%A9%E6%88%98%E7%A5%9E%EF%BC%9A%E7%A0%B4%E5%9F%9F%E8%80%85"},{id:"%E5%A0%95%E5%A4%A9%E6%88%98%E7%A5%9E%EF%BC%9A%E6%97%A0%E8%B4%A5%E5%86%A0%E5%86%9B",name:"堕天战神：无败冠军",original:"FALLEN WARLORD：UNDEFEATED CHAMPION",tier:4,type:"独狼",difficulty:18,thresholds:[35,58],hp:11,stress:5,attack:{bonus:"+8",weapon:"殁心剑",range:"邻近",damage:"4d12+13 物理",line:"攻击：+8 | 殁心剑：邻近 | 4d12+13 物理"},experiences:"",description:"最令尘世畏惧，也只能在其面前堕入恐惧。",motives:"无情赐死，惩叛罚逆，不惜代价取胜",tierNote:"",features:[{name:"无情 Relentless (3) - 被动",desc:"在每个游戏主持人轮次中，无败冠军可以至多被聚焦 3 次。像往常一样花费恐惧点来聚焦。"},{name:"残破甲胄 Faltering Armor - 被动",desc:"无败冠军受到伤害时将其数值降低1d10。"},{name:"粉碎强袭 Shattering Strike - 动作",desc:"标记 1 压力点，对邻近范围内的所有目标发动一次普通攻击。被该攻击击中的玩家角色还会失去与其因此次攻击而标记的生命点的等量希望点。"},{name:"无尽军团 Endless Legions - 动作",desc:"花费 1 恐惧点在远距离范围内召唤数量等于玩家角色两倍的堕天突击兵。"},{name:"污邪法环 Circle of Defilement - 反应",desc:"倒计时（1d8）。当无败冠军首次被聚焦时，启动倒计时。其在触发时会启动一道覆盖至无败冠军的远距离范围的法阵。区域内的目标处于脆弱状态，直至其离开法阵。对无败冠军造成严重伤害即可破除此这一法阵。"},{name:"乘胜追击 Momentum - 反应",desc:"当无败冠军成功命中玩家角色时，你获得 1 恐惧点。"},{name:"末日凶兆 Doombringer - 反应",desc:"当目标因无败冠军的攻击而标记生命点时，所有位于目标远距离范围内的玩家角色都失去 1 希望点。"}],url:"https://daggerheart.huijiwiki.com/wiki/%E5%A0%95%E5%A4%A9%E6%88%98%E7%A5%9E%EF%BC%9A%E6%97%A0%E8%B4%A5%E5%86%A0%E5%86%9B"},{id:"%E5%9C%A3%E5%8C%96%E5%BC%93%E6%89%8B",name:"圣化弓手",original:"HALLOWED ARCHER",tier:4,type:"远程",difficulty:19,thresholds:[25,45],hp:3,stress:2,attack:{bonus:"+4",weapon:"祝圣长弓",range:"远距离",damage:"4d8+8 物理",line:"攻击：+4 | 祝圣长弓：远距离 | 4d8+8 物理"},experiences:"",description:"手执祝圣之弓的灵体军士。",motives:"集火，服从，重新部署，齐射",tierNote:"",features:[{name:"惩罪者 Punish the Guilty - 被动",desc:"圣化弓手对被上位神使标记为罪人的目标造成双倍伤害。"},{name:"至圣箭雨 Divine Volley - 动作",desc:"标记 1 压力点对至多3个目标发动一次普通攻击。"}],url:"https://daggerheart.huijiwiki.com/wiki/%E5%9C%A3%E5%8C%96%E5%BC%93%E6%89%8B"},{id:"%E5%9C%A3%E5%8C%96%E5%A3%AB%E5%85%B5",name:"圣化士兵",original:"HALLOWED SOLDIER",tier:4,type:"杂兵",difficulty:18,thresholds:[null,null],hp:1,stress:2,attack:{bonus:"+2",weapon:"剑与盾",range:"近战",damage:"10 物理",line:"攻击：+2 | 剑与盾：近战 | 10 物理"},experiences:"",description:"高举至圣兵刃的虔信圣灵。",motives:"服从，智取，惩戒，集群",tierNote:"",features:[{name:"杂兵 Minion (X) - 被动",desc:"当圣化士兵受到任何伤害时，其即被击败。玩家角色每对圣化士兵造成 13 点伤害，则在攻击能够成功命中的范围内额外击败一个杂兵。"},{name:"至圣之翼 Divine Flight - 被动",desc:"当圣化士兵飞行时，花费 1 恐惧点即可在执行一项动作前在远距离范围内移动，而非近距离范围。"},{name:"群体攻击 Group Attack - 动作",desc:"花费 1 恐惧点选择一个目标，并聚焦所有在目标近距离范围内的圣化士兵。当这些杂兵移动至目标的近战范围时，进行一次共享的攻击掷骰。若成功，每只圣化士兵造成10点物理伤害，将伤害合并计算。"}],url:"https://daggerheart.huijiwiki.com/wiki/%E5%9C%A3%E5%8C%96%E5%A3%AB%E5%85%B5"},{id:"%E4%B8%8A%E4%BD%8D%E7%A5%9E%E4%BD%BF",name:"上位神使",original:"HIGH SERAPH",tier:4,type:"头目",difficulty:20,thresholds:[37,70],hp:7,stress:5,attack:{bonus:"+8",weapon:"圣剑",range:"邻近",damage:"4d10+10 物理",line:"攻击：+8 | 圣剑：邻近 | 4d10+10 物理"},experiences:"神圣学识+3",description:"圣洁的勇者，统领着执行神祇之志的圣化军团。",motives:"执行教条，飞行，宣告审判，惩戒重击",tierNote:"",features:[{name:"无情 Relentless (X) - 被动",desc:"在每个游戏主持人轮次中，上位神使可以至多被聚焦 2 次。像往常一样花费恐惧点来聚焦。"},{name:"至圣之翼 Divine Flight - 被动",desc:"当上位神使飞行时，花费 1 恐惧点即可在执行一项动作前在远距离范围内移动，而非近距离范围。"},{name:"圣裁 Judgment - 动作",desc:"花费 1 恐惧点令一个生物在上位神使的神祇眼中处于有罪状态，持续至上位神使被击败。目标在处于有罪状态时，无法因掷出希望结果而获得希望。上位神使的普通攻击会在成功命中处于有罪状态的目标时，造成严重伤害而非原本的伤害。同一时间段内上位神使只能标记一个目标。"},{name:"神力光束 God Rays - 动作",desc:"标记 1 压力点展现些许神力本源，将之化作炽烈的光束射线，令其射向极远范围内至多20个目标。目标必须进行一次风度反应掷骰（处于有罪状态时在此掷骰中具有劣势），失败时受到4d6+12点魔法伤害，成功则所受伤害减半。"},{name:"万军齐心 We Are One - 动作",desc:"每场景一次，花费 1 恐惧点聚焦远距离范围内所有其余敌人。因此被聚焦者的攻击伤害减半。"}],url:"https://daggerheart.huijiwiki.com/wiki/%E4%B8%8A%E4%BD%8D%E7%A5%9E%E4%BD%BF"},{id:"%E5%85%8B%E6%8B%89%E8%82%AF",name:"克拉肯",original:"KRAKEN",tier:4,type:"独狼",difficulty:20,thresholds:[35,70],hp:11,stress:8,attack:{bonus:"+7",weapon:"触腕",range:"近距离",damage:"4d12+10 物理",line:"攻击：+7 | 触腕：近距离 | 4d12+10 物理"},experiences:"游泳+3",description:"一种传奇海怪，生着遍布吸盘的触手与怖人的巨颚，就连最大的帆船都无法与其身形相匹。",motives:"吞噬，粉碎，淹没，缠斗",tierNote:"",features:[{name:"无情 Relentless (3) - 被动",desc:"在每个游戏主持人轮次中，克拉肯可以至多被聚焦 3 次。像往常一样花费恐惧点来聚焦。"},{name:"触腕狂舞 Many Tentacles - 被动",desc:"若克拉肯已标记的生命点数量小于等于7，其普通攻击可同时针对两个范围内的目标。"},{name:"拖入深渊 Grapple and Drown - 动作",desc:"对近距离范围内的一个目标发动一次攻击掷骰。成功时，标记 1 压力点令目标被一条触腕抓住并拖入水下。目标处于束缚与脆弱状态，且在进行一次动作掷骰时必须标记 1 压力点。这些效果会在目标通过一次成功的力量掷骰重获自由、或是当克拉肯受到重度或更严重的伤害时清除。"},{name:"腾浪喷涌 Boiling Blast - 动作",desc:"花费 1 恐惧点向一条长度至多为远距离的直线上的所有目标喷出一条翻腾的巨浪。每个目标都必须成功通过一次敏捷反应掷骰，否则受到4d6+9物理伤害。若目标想标记 1 护甲槽点以降低该伤害，则其还必须标记 1 压力点。"},{name:"乘胜追击 Momentum - 反应",desc:"当克拉肯成功命中玩家角色时，你获得 1 恐惧点。"}],url:"https://daggerheart.huijiwiki.com/wiki/%E5%85%8B%E6%8B%89%E8%82%AF"},{id:"%E6%9C%AB%E6%97%A5%E7%A5%9E%E8%B0%95%E8%80%85",name:"末日神谕者",original:"ORACLE OF DOOM",tier:4,type:"独狼",difficulty:20,thresholds:[38,68],hp:11,stress:10,attack:{bonus:"+8",weapon:"精神攻击",range:"远距离",damage:"4d8+9 魔法",line:"攻击：+8 | 精神攻击：远距离 | 4d8+9 魔法"},experiences:"无尽知识+4",description:"身姿高大的不朽者，命运伟岸的化身。深陷诅咒之中，所见皆为末日。",motives:"改变环境，谴罪，心碎，丢弃",tierNote:"",features:[{name:"惊怖 Terrifying - 被动",desc:"当末日神谕者成功攻击时，所有远距离范围内的玩家角色失去 1 希望点，而你获得 1 恐惧点。"},{name:"巨物威压 Walls Closing In - 被动",desc:"位于末日神谕者极远范围内的生物掷骰失败时，必须标记 1 压力点。"},{name:"宣昭宿命 Pronounce Fate - 动作",desc:"花费 1 恐惧点向远距离范围内的一个目标展现其心中的梦魇。目标必须进行一次知识反应掷骰。失败则失去所有希望点并受到2d20+4点直接魔法伤害。成功时受到一半伤害并失去1希望点。"},{name:"召唤苦难 Summon Tormenrors - 动作",desc:"每天一次，花费 2 恐惧点召唤 2d4 个位阶2 或更低的、与某个玩家角色心中的梦魇相关联的杂兵，其将出现在该玩家角色的近距离范围处。"},{name:"噩兆学识 Ominous Knowledge - 反应",desc:"末日神谕者在看到一个凡人生物时即可知晓其心中的一道梦魇。"},{name:"宿命轮回 Vengeful Fate - 反应",desc:"末日神谕者因邻近范围内的一次攻击标记生命点时，你可以标记 1 压力点来将攻击者击飞至远距离范围并造成2d10+4点物理伤害。"}],url:"https://daggerheart.huijiwiki.com/wiki/%E6%9C%AB%E6%97%A5%E7%A5%9E%E8%B0%95%E8%80%85"},{id:"%E5%BC%82%E7%95%8C%E6%86%8E%E6%81%B6%E4%BD%93",name:"异界憎恶体",original:"OUTER REALMS ABOMINATION",tier:4,type:"斗士",difficulty:19,thresholds:[35,71],hp:7,stress:5,attack:{bonus:"+2d4",weapon:"巨量伪足",range:"邻近",damage:"4d6+13 魔法",line:"攻击：+2d4 | 巨量伪足：邻近 | 4d6+13 魔法"},experiences:"",description:"不断蠕变、不可名状的混沌生命体。",motives:"摧毁，吞食，侵蚀",tierNote:"",features:[{name:"混沌形体 Chaotic Form - 被动",desc:"当异界憎恶体攻击时，掷骰2d4并将其作为该次攻击的调整值。"},{name:"迷惘之物 Disorienting Presence - 被动",desc:"当一个目标受到异界憎恶体的伤害时，其必须进行一次本能反应掷骰。若失败，则其下次动作掷骰具有劣势，且你获得 1 恐惧点。"},{name:"实界震荡 Reality Quake - 动作",desc:"花费 1 恐惧点令界外界憎恶体远距离范围内的现实边界发出惊怖的嗡鸣。所有位于该区域内的目标都必须成功通过一次知识反应掷骰，否则将处于紊乱状态直至该场景结束。处于紊乱状态的目标在消耗希望点、标记护甲槽、生命点、压力点时，都必须加倍其消耗量或标记量。"},{name:"虚妄形体 Unreal Form - 反应",desc:"当异界憎恶体受到伤害时，该伤害将减少1d20。若异界憎恶体受到一次成功击中它的攻击但只标记了1点或更少的生命点，则你获得 1 恐惧点。"}],url:"https://daggerheart.huijiwiki.com/wiki/%E5%BC%82%E7%95%8C%E6%86%8E%E6%81%B6%E4%BD%93"},{id:"%E5%BC%82%E7%95%8C%E8%85%90%E6%9B%9C%E4%BD%93",name:"异界腐曜体",original:"OUTER REALMS CORRUPTER",tier:4,type:"辅助",difficulty:19,thresholds:[27,47],hp:4,stress:3,attack:{bonus:"+7",weapon:"腐蚀伪足",range:"邻近",damage:"4d8+5 魔法",line:"攻击：+7 | 腐蚀伪足：邻近 | 4d8+5 魔法"},experiences:"",description:"由繁彩幻光交织而成、不停变化着的无形之物。",motives:"蛊惑，转移注意，制服",tierNote:"",features:[{name:"意志摧毁之触 Will-Shattering Touch - 被动",desc:"当一名玩家角色因异界腐曜体而受到伤害时，其还会失去1希望点。"},{name:"现实残渣洪流 Disgorge Reality Flotsam - 动作",desc:"标记 1 压力点将被其吞噬消化过的现实残渣喷涌向近距离范围内的所有目标。目标必须成功通过一次知识反应掷骰，否则标记 2 压力点。"}],url:"https://daggerheart.huijiwiki.com/wiki/%E5%BC%82%E7%95%8C%E8%85%90%E6%9B%9C%E4%BD%93"},{id:"%E5%BC%82%E7%95%8C%E4%BB%86%E4%BB%8E",name:"异界仆从",original:"OUTER REALMS THRALL",tier:4,type:"杂兵",difficulty:17,thresholds:[null,null],hp:1,stress:1,attack:{bonus:"+3",weapon:"爪与牙",range:"邻近",damage:"11 物理",line:"攻击：+3 | 爪与牙：邻近 | 11 物理"},experiences:"",description:"被剥离了记忆与个性，勉强保留着人型外形的生命体。",motives:"破坏，憎恨，迷惘，威吓",tierNote:"",features:[{name:"杂兵 Minion（13） - 被动",desc:"异界仆从在受到任何伤害时都将立即被击败。玩家角色每对异界仆从造成13点伤害，即可在该次攻击的范围内额外再击败一个能够命中的杂兵。"},{name:"群体攻击 Group Attack - 动作",desc:"花费 1 恐惧点选择一个目标，并聚焦所有在目标近距离范围内的异界仆从。当这些杂兵移动至目标的近战范围时，进行一次共享的攻击掷骰。若成功，每个异界仆从造成11点物理伤害，将伤害合并计算。"}],url:"https://daggerheart.huijiwiki.com/wiki/%E5%BC%82%E7%95%8C%E4%BB%86%E4%BB%8E"},{id:"%E7%81%AB%E5%B1%B1%E5%B7%A8%E9%BE%99%EF%BC%9A%E9%BB%91%E6%9B%9C%E7%8C%8E%E6%89%8B",name:"火山巨龙：黑曜猎手",original:"VOLCANIC DRAGON：OBSIDIAN PREDATOR",tier:4,type:"独狼",difficulty:19,thresholds:[33,65],hp:6,stress:5,attack:{bonus:"+8",weapon:"黑曜利爪",range:"近距离",damage:"4d10+4 物理",line:"攻击：+8 | 黑曜利爪：近距离 | 4d10+4 物理"},experiences:"空中猎杀+5",description:"巨翼遮天，黑鳞覆体，锐爪开山，巨型骇兽。",motives:"保卫巢穴，俯冲轰炸，飞行，狩猎，威吓",tierNote:"",features:[{name:"无情 Relentless (2) - 被动",desc:"在每个游戏主持人轮次中，黑曜猎手可以至多被聚焦 2 次。像往常一样花费恐惧点来聚焦。"},{name:"飞行 Flying - 被动",desc:"飞行时，黑曜猎手的难度获得 +3 加值。"},{name:"黑曜龙鳞 Obsidian Scales - 被动",desc:"黑曜猎手具有对物理伤害的抗性。"},{name:"山崩尾扫 Acalanche Tail - 动作",desc:"标记 1 压力点对近距离范围内的所有目标发动一次攻击。被黑曜猎手成功命中的目标受4d6+4物理伤害被击飞至远距离范围并处于脆弱状态，直至其下次掷出希望结果。"},{name:"俯冲猛袭 Dive-Bomb - 动作",desc:"若黑曜猎手正在飞行，标记 1 压力点并选择远距离范围内的一点。移动至该点并对邻近范围内的所有目标发动一次攻击。被黑曜猎手成功命中的目标受到2d10+6物理伤害，必须标记 1 压力点并失去1希望点。"},{name:"怒炎爆发 Erupting Rage - 反应",desc:"当黑曜猎手标记其最后1点生命点时，将其替换为火山巨龙：熔炎天灾并立即给予其聚焦。"}],url:"https://daggerheart.huijiwiki.com/wiki/%E7%81%AB%E5%B1%B1%E5%B7%A8%E9%BE%99%EF%BC%9A%E9%BB%91%E6%9B%9C%E7%8C%8E%E6%89%8B"},{id:"%E7%81%AB%E5%B1%B1%E5%B7%A8%E9%BE%99%EF%BC%9A%E7%86%94%E7%82%8E%E5%A4%A9%E7%81%BE",name:"火山巨龙：熔炎天灾",original:"VOLCANIC DRAGON：MOLTEN SCOURGE",tier:4,type:"独狼",difficulty:20,thresholds:[30,58],hp:7,stress:5,attack:{bonus:"+9",weapon:"熔岩利爪",range:"近距离",damage:"4d12+4 物理",line:"攻击：+9 | 熔岩利爪：近距离 | 4d12+4 物理"},experiences:"空中猎杀+5",description:"伤痕令巨龙狂怒，其躯体化作熔融的岩浆。",motives:"挥洒熔岩，焚化，驱逐入侵者，重新部署",tierNote:"",features:[{name:"无情 Relentless (3) - 被动",desc:"在每个游戏主持人轮次中，熔岩天灾可以至多被聚焦 3 次。像往常一样花费恐惧点来聚焦。"},{name:"崩裂龙鳞 Cracked Scales - 被动",desc:"当熔炎天灾受到伤害时，掷出等同于其标记生命点数量的d6。每掷出一次4或更高的结果，你获得 1 恐惧点。"},{name:"粉碎狂袭 Shattering Might - 动作",desc:"标记 1 压力点对邻近范围内的一个目标发动一次攻击。若成功命中，则目标受4d8+1物理伤害，失去1希望点，且被击飞至近距离范围。熔炎天灾则清除 1 压力点。"},{name:"火山爆发 Eruption - 动作",desc:"花费 1 恐惧点令岩浆自熔炎天灾的鳞片之间爆发，使其邻近范围被熔融的岩浆所覆盖。所有位于该区域内的目标都必须成功通过一次敏捷反应掷骰，否则受到4d6+6物理伤害且被击飞至近距离范围。岩浆会持续覆盖该区域。每当一个除熔炎天灾外的生物进入该区域或在其中行动时，都必须标记 6 生命点。"},{name:"火山吐息 Volcanic Breath - 反应",desc:"当熔炎天灾受到重度伤害时，掷1d10。若掷出8点或更高，则熔炎天灾向面前呼出一道岩浆洪流，直至其远距离范围。所有位于区域内的目标都必须进行一次敏捷反应掷骰。失败者受2d10+4物理伤害且标记 1d4 压力点且处于脆弱状态直至清除至少1压力点；成功则只受到一半伤害且不标记压力点。"},{name:"熔岩之血 Lava Splash - 反应",desc:"当熔炎天灾因临近范围内的生物而受到严重伤害时，熔融的炎血将会自伤口中迸出，对攻击者造成2d10+4的直接物理伤害。"},{name:"复仇余烬 Ashen Vengeance - 反应",desc:"当熔炎天灾标记其最后1点生命点时，将其替换为火山巨龙：余烬暴君并立即给予其聚焦。"}],url:"https://daggerheart.huijiwiki.com/wiki/%E7%81%AB%E5%B1%B1%E5%B7%A8%E9%BE%99%EF%BC%9A%E7%86%94%E7%82%8E%E5%A4%A9%E7%81%BE"},{id:"%E7%81%AB%E5%B1%B1%E5%B7%A8%E9%BE%99%EF%BC%9A%E4%BD%99%E7%83%AC%E6%9A%B4%E5%90%9B",name:"火山巨龙：余烬暴君",original:"VOLCANIC DRAGON：ASHEN TYRANT",tier:4,type:"独狼",difficulty:18,thresholds:[29,55],hp:8,stress:5,attack:{bonus:"+10",weapon:"爪与牙",range:"近距离",damage:"4d12+15 物理",line:"攻击：+10 | 爪与牙：近距离 | 4d12+15 物理"},experiences:"空中猎杀+5",description:"从没有敌人对巨龙造成过如此严重的伤痕。岩浆凝结，巨龙的残躯如同它昔日消灭的那些敌人一般化作灰烬。",motives:"窒息，飞行，威吓，你死我亡",tierNote:"",features:[{name:"无情 Relentless (4) - 被动",desc:"在每个游戏主持人轮次中，余烬暴君可以至多被聚焦 4 次。像往常一样花费恐惧点来聚焦。"},{name:"绝境反扑 Concered - 被动",desc:"标记 1 压力点以无需消耗恐惧点地聚焦余烬暴君。"},{
